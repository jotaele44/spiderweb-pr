# Pre-commit hook config (X1) — local fast feedback before push.
#
# Install once:    pip install pre-commit && pre-commit install
# Run manually:    pre-commit run --all-files
#
# Each hook is designed to finish in <10 s so the commit experience is fast.
# The full release-gate + CI smoke tests run separately (Makefile / GitHub
# Actions). Hook config is intentionally minimal — adding heavier checks
# (full pytest run, EarthGPT selftest) belongs in the release-check CI job,
# not the commit path.
repos:
  # Fast file-hygiene hooks (T6-48). All complete in well under a second.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: py-compile
        name: py_compile (syntax check)
        entry: python3 -m py_compile
        language: system
        files: '\.py$'
        # Stop on the first failure — line numbers are enough to fix in-editor.
        verbose: true

      - id: schema-validation-tests
        name: pytest tests/test_schema_validation.py
        entry: python3 -m pytest tests/test_schema_validation.py -q --tb=line
        language: system
        # Run once per commit, not per-file. Pass_filenames: false suppresses
        # the per-file invocation that pre-commit's default does.
        pass_filenames: false
        # Only run when schema files or validator changed.
        files: '^(integration/schema_validation\.py|schemas/.*|tests/test_schema_validation\.py)$'

      - id: release-check-demo-skiptests
        name: release_check --skip-tests --demo (smoke)
        entry: python3 release_check.py --db /tmp/precommit_smoke.db --output-dir /tmp/precommit_release --skip-tests --demo
        language: system
        pass_filenames: false
        # Only run when the release gate itself or its inputs changed.
        files: '^(release_check\.py|run_all\.py|run_modes\.py|provenance_utils\.py|Makefile)$'
        # Don't run on every commit — only the relevant ones.
        stages: [pre-commit]

  # Documentation must not contradict the change. Local because the script is a
  # rendered file in this very repo, and because it needs the whole index rather
  # than the batches of file names pre-commit hands a hook. Stdlib only, so the
  # hook environment installs nothing. At commit time a missing doc update is a
  # warning (the message that could waive it is not written yet); a reference the
  # commit breaks is an error. CI (docs-sync) is the authority on both.
  - repo: local
    hooks:
      - id: docs-sync
        name: docs-sync (references + co-change, staged)
        entry: python tools/check_docs_sync.py --staged
        language: python
        pass_filenames: false
        always_run: true
        verbose: true # co-change findings are warnings here; show them
