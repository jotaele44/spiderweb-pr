[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderweb-pr"
version = "0.1.0"
description = "Puerto Rico Airspace Intelligence System — FR24 OCR/GIS flight intelligence, federation, and the GEBCO bathymetry pipeline"
requires-python = ">=3.11"
# Shared scientific stack. This is the single source of truth for version ranges;
# requirements*.txt defer to these, and constraints.txt holds the exact pins.
# Upper bounds intentionally loose (<next-major) to reduce resolver friction.
dependencies = [
    "numpy>=2.4,<3",
    "scipy>=1.17,<2",
    "pandas>=3.0,<4",
    "xarray>=2026.1,<2027",
    "netCDF4>=1.7.4,<2",
    "matplotlib>=3.10,<4",
    "shapely>=2.1,<3",
    "scikit-image>=0.26,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "black>=26.3.0,<27",
    "ruff>=0.15.5,<0.16",
]

[tool.setuptools.packages.find]
include = [
    "pipeline*",
    "fr24*",
    "integration*",
    "readiness*",
    "federation*",
    "server*",
    "scripts*",
    "gebco*",
    "earthgpt*",
    "llm*",
]

# ---------------------------------------------------------------------------
# Exact pins for fully reproducible environments (pip install -c constraints.txt)
# ---------------------------------------------------------------------------
# numpy==2.4.2          (2.4.0 was yanked — always use 2.4.2)
# scipy==1.17.1
# pandas==3.0.1
# xarray==2026.2.0
# netCDF4==1.7.4
# matplotlib==3.10.8
# shapely==2.1.2
# scikit-image==0.26.0
# openpyxl==3.1.5
# pytest==9.0.2
# black==26.3.0
# ruff==0.15.5

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default test run excludes integration tests (live external dependencies).
# Run integration tier explicitly with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "smoke: tests that depend on generated artifacts (data/*.geojson, manifest) — skip cleanly if missing.",
    "integration: tests that hit live external services (e.g. Census TIGER downloads). Excluded from default runs.",
]
