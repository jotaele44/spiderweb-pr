<!DOCTYPE html>
<!--
  Puerto Rico Airspace Intelligence Dashboard
  ============================================
  Standalone browser dashboard — no build step required.

  Usage:
    1. Export a DB snapshot:
         python run_all.py --db ~/flight_database.db --export-json dashboard_data.json

    2. Open this file in a browser:
         open dashboard.html          # macOS
         xdg-open dashboard.html      # Linux
         # or serve with: python -m http.server 8080

  The page loads dashboard_data.json from the same directory via fetch().
  If served from a local file:// URL, use --allow-file-access-from-files (Chrome)
  or simply run the python http.server one-liner above.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puerto Rico Airspace Intelligence</title>

  <!-- Tailwind CSS (CDN, v3) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpiles JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: sans-serif; color: #6b7280; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading flight data…</div>
  <div id="root" style="display:none"></div>

  <script>
    // Fetch the JSON export(s), inject into window.*, then mount the app.
    // FR24 review queue and temporal waves load in parallel and degrade gracefully.
    const fetchJson = (url) =>
      fetch(url).then(r => {
        if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
        return r.json();
      });

    Promise.allSettled([
      fetchJson("dashboard_data.json"),
      fetchJson("fr24_dashboard_review_queue.json"),
      fetchJson("fr24_temporal_wave_dashboard.json"),
    ]).then(([flight, fr24, temporal]) => {
      if (flight.status === "rejected") {
        const err = flight.reason && flight.reason.message ? flight.reason.message : String(flight.reason);
        document.getElementById("loading").innerHTML =
          `<div style="text-align:center">
            <p style="color:#dc2626;font-weight:600">Could not load dashboard_data.json</p>
            <p style="margin-top:8px;font-size:12px">${err}</p>
            <p style="margin-top:4px;font-size:12px">
              Generate it with:<br/>
              <code style="background:#f3f4f6;padding:2px 6px;border-radius:4px">
                python run_all.py --db ~/flight_database.db --export-json dashboard_data.json
              </code>
            </p>
            <p style="margin-top:4px;font-size:12px">Then serve this directory:<br/>
              <code style="background:#f3f4f6;padding:2px 6px;border-radius:4px">python -m http.server 8080</code>
            </p>
          </div>`;
        return;
      }
      window.flightData = flight.value;
      window.fr24DashboardData = fr24.status === "fulfilled" ? fr24.value : null;
      window.fr24TemporalWaveData = temporal.status === "fulfilled" ? temporal.value : null;
      document.getElementById("loading").style.display = "none";
      document.getElementById("root").style.display = "";
    });
  </script>

  <!-- Load dashboard.jsx via Babel (transpiled at runtime) -->
  <script type="text/babel" src="dashboard.jsx" data-type="module"></script>

  <!-- Optional temporal-wave visibility overlay; read-only and candidate-only. -->
  <script type="text/babel" src="dashboard_temporal_waves.jsx" data-type="module"></script>
</body>
</html>
