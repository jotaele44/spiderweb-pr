name: Exact Floot recovery v4 — Spiderweb

on:
  push:
    branches:
      - recovery/floot-baseline-2026-09-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-floot-recovery-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install v4 npx interception
        shell: bash
        run: |
          set -euo pipefail
          echo "REAL_NPX=$(command -v npx)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/recovery-bin"
          cp .recovery/spiderweb-exact/npx-v4-wrapper.sh "$RUNNER_TEMP/recovery-bin/npx"
          chmod +x "$RUNNER_TEMP/recovery-bin/npx"
          echo "$RUNNER_TEMP/recovery-bin" >> "$GITHUB_PATH"

      - name: Execute exact recovered-tree runner with v4 harness
        shell: bash
        run: bash .recovery/spiderweb-exact/run_v3.sh

      - name: Upload exact-tree recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-exact-floot-recovery-v4
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package.original.json
            ${{ runner.temp }}/recovered/package.json
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/recovery-package-hashes.txt
            ${{ runner.temp }}/recovered/recovery-harness-v4-hashes.txt
            ${{ runner.temp }}/recovered/recovery-environment.txt
            ${{ runner.temp }}/recovered/recovery.vitest.config.mts
            ${{ runner.temp }}/recovered/recovery.vitest.setup.mjs
            ${{ runner.temp }}/recovered/recovery-vitest.log
            ${{ runner.temp }}/recovered/recovery-test-exit.txt
            ${{ runner.temp }}/recovered/recovery-spec-files.txt
            ${{ runner.temp }}/recovered/recovery-spec-classification.tsv

      - name: Enforce recovered-suite result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ runner.temp }}/recovered/recovery-test-exit.txt"
          exit "$(cat "${{ runner.temp }}/recovered/recovery-test-exit.txt")"
