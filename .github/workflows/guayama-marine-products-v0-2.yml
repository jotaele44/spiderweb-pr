name: Guayama marine products v0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Execute bounded NCEI product enumeration
        run: |
          set -euo pipefail
          mkdir -p evidence/marine/guayama_punta_tuna_products_v0_2
          PYTHONPATH=. python scripts/run_guayama_marine_products.py \
            > evidence/marine/guayama_punta_tuna_products_v0_2.stdout.json \
            2> evidence/marine/guayama_punta_tuna_products_v0_2.stderr.txt

      - name: Freeze product artifact ledger
        if: always()
        run: |
          set -euo pipefail
          cd evidence/marine
          if [ -d guayama_punta_tuna_products_v0_2 ]; then
            find guayama_punta_tuna_products_v0_2 -type f -print0 | sort -z | xargs -0 -r sha256sum > guayama_punta_tuna_products_v0_2.sha256
          else
            : > guayama_punta_tuna_products_v0_2.sha256
          fi
          for f in guayama_punta_tuna_products_v0_2.stdout.json guayama_punta_tuna_products_v0_2.stderr.txt; do
            if [ -f "$f" ]; then sha256sum "$f" >> guayama_punta_tuna_products_v0_2.sha256; fi
          done

      - name: Upload product evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: guayama-punta-tuna-products-v0-2
          path: |
            evidence/marine/guayama_punta_tuna_products_v0_2/
            evidence/marine/guayama_punta_tuna_products_v0_2.stdout.json
            evidence/marine/guayama_punta_tuna_products_v0_2.stderr.txt
            evidence/marine/guayama_punta_tuna_products_v0_2.sha256
          if-no-files-found: warn
          retention-days: 30
