name: maintenance

# Audit-first maintenance for spiderweb-pr. Runs the maintenance tests and the
# audit-mode script, uploads the report as an artifact, and never auto-commits.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[federation,dev]
      - name: Maintenance tests
        run: python -m pytest tests/test_maintenance.py -q
      - name: Audit run
        run: python3 scripts/run_maintenance.py --repo spiderweb-pr --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
