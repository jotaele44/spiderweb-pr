name: Martin municipios canary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/martin-canary.yml"
      - "martin/**"
      - "configs/martin_delivery.yaml"
      - "configs/layer_catalog.yaml"
      - "data/tiger/2025/manifest.json"
      - "scripts/build_martin_canary_fixture.py"
      - "scripts/build_martin_config.py"
      - "scripts/build_martin_delivery_artifact.py"
      - "scripts/check_martin_canary.py"
      - "scripts/check_martin_mvt_parity.py"
      - "server/frontend/src/config.ts"
      - "server/frontend/src/vite-env.d.ts"
      - "server/frontend/src/modules/SpatialIntelligence.tsx"
      - "server/frontend/vite.config.ts"

permissions:
  contents: read

concurrency:
  group: martin-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARTIN_ASSET_URL: https://github.com/maplibre/martin/releases/download/martin-v1.13.0/martin-x86_64-unknown-linux-musl.tar.gz
      MARTIN_ASSET_SHA256: 96d6415ca3b18f843eb0ef28f44d34b96c494b192e9ef7e7289b3bc88612009d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic canary dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[geo,server]" PyYAML "mapbox-vector-tile==2.2.0"

      - name: Verify immutable Martin 1.13.0 runtime asset
        run: |
          curl --fail --location --retry 3 "$MARTIN_ASSET_URL" -o /tmp/martin.tar.gz
          echo "$MARTIN_ASSET_SHA256  /tmp/martin.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/martin-bin
          tar -xzf /tmp/martin.tar.gz -C /tmp/martin-bin
          MARTIN_BIN="$(find /tmp/martin-bin -type f -name martin -perm -111 | head -n 1)"
          test -n "$MARTIN_BIN"
          echo "MARTIN_BIN=$MARTIN_BIN" >> "$GITHUB_ENV"
          "$MARTIN_BIN" --version | tee /tmp/martin-version.txt
          grep -F "1.13.0" /tmp/martin-version.txt

      - name: Rebuild canonical and property-minimized municipios delivery
        run: |
          sudo mkdir -p /spiderweb-data
          sudo chown "$USER":"$USER" /spiderweb-data
          python scripts/build_martin_canary_fixture.py --output /spiderweb-data/municipios.geojson
          test "$(sha256sum /spiderweb-data/municipios.geojson | cut -d' ' -f1)" = "adebd4e779e36ca4aecb69291af9e153e430a829cc4ca8a676f7d5f5197a5d76"
          python scripts/build_martin_delivery_artifact.py \
            --source /spiderweb-data/municipios.geojson \
            --output /spiderweb-data/municipios.delivery.geojson \
            --receipt /tmp/municipios-delivery-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/municipios-delivery-receipt.json', encoding='utf-8'))
          assert r['feature_count']==78
          assert r['identity_count']==78
          assert r['symmetric_difference_count']==0
          assert r['public_properties']==['GEOID','NAME']
          assert r['unexpected_properties']==[]
          print('PASS: canonical->delivery parity and property minimization')
          PY
          chmod a-w /spiderweb-data/municipios.geojson /spiderweb-data/municipios.delivery.geojson

      - name: Generate certification and production configs deterministically
        run: |
          python scripts/build_martin_config.py --environment certification --output /tmp/martin-cert.yaml --manifest /tmp/martin-cert.manifest.json
          python scripts/build_martin_config.py --environment certification --output /tmp/martin-cert-2.yaml --manifest /tmp/martin-cert-2.manifest.json
          cmp /tmp/martin-cert.yaml /tmp/martin-cert-2.yaml
          python scripts/build_martin_config.py --environment production --output /tmp/martin-prod.yaml --manifest /tmp/martin-prod.manifest.json
          python scripts/build_martin_config.py --environment production --output /tmp/martin-prod-2.yaml --manifest /tmp/martin-prod-2.manifest.json
          cmp /tmp/martin-prod.yaml /tmp/martin-prod-2.yaml
          python - <<'PY'
          import yaml
          cert=yaml.safe_load(open('/tmp/martin-cert.yaml', encoding='utf-8'))
          prod=yaml.safe_load(open('/tmp/martin-prod.yaml', encoding='utf-8'))
          assert set(cert['geojson']['sources']) == {'municipios'}
          assert set(prod['geojson']['sources']) == {'municipios'}
          assert 'paths' not in cert['geojson'] and 'paths' not in prod['geojson']
          print('PASS: published municipios is admitted to both certification and production')
          PY

      - name: Start Martin and certify generated catalog TileJSON and MVT identity
        run: |
          "$MARTIN_BIN" --config /tmp/martin-cert.yaml >/tmp/martin.log 2>&1 &
          echo $! >/tmp/martin.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/health
          python scripts/check_martin_canary.py --base http://127.0.0.1:3000
          python scripts/check_martin_mvt_parity.py --base http://127.0.0.1:3000 --source /spiderweb-data/municipios.delivery.geojson

      - name: Prove Martin-down isolation and clean restart
        run: |
          kill "$(cat /tmp/martin.pid)"
          if python scripts/check_martin_canary.py --base http://127.0.0.1:3000; then
            echo "FAIL: canary checker succeeded with Martin stopped" >&2
            exit 1
          fi

          python -m uvicorn server.backend.main:app --host 127.0.0.1 --port 8000 >/tmp/fastapi-isolation.log 2>&1 &
          api_pid=$!
          api_status=""
          for i in $(seq 1 30); do
            api_status="$(curl --silent --output /tmp/fastapi-health.json --write-out '%{http_code}' http://127.0.0.1:8000/health || true)"
            if [ "$api_status" = "200" ] || [ "$api_status" = "503" ]; then break; fi
            sleep 1
          done
          test "$api_status" = "200" -o "$api_status" = "503"
          kill "$api_pid" || true

          "$MARTIN_BIN" --config /tmp/martin-cert.yaml >/tmp/martin-restart.log 2>&1 &
          echo $! >/tmp/martin.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          python scripts/check_martin_canary.py --base http://127.0.0.1:3000

      - name: Fail closed on missing or corrupt delivery input
        run: |
          kill "$(cat /tmp/martin.pid)" || true
          sed 's#/spiderweb-data/municipios.delivery.geojson#/spiderweb-data/DOES_NOT_EXIST.geojson#' /tmp/martin-cert.yaml >/tmp/martin-missing.yaml
          "$MARTIN_BIN" --config /tmp/martin-missing.yaml >/tmp/martin-missing.log 2>&1 &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "FAIL: Martin remained alive with missing authorized source" >&2
            exit 1
          fi

          printf '{not valid geojson' >/tmp/corrupt-municipios.geojson
          sed 's#/spiderweb-data/municipios.delivery.geojson#/tmp/corrupt-municipios.geojson#' /tmp/martin-cert.yaml >/tmp/martin-corrupt.yaml
          "$MARTIN_BIN" --config /tmp/martin-corrupt.yaml >/tmp/martin-corrupt.log 2>&1 &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "FAIL: Martin remained alive with corrupt authorized source" >&2
            exit 1
          fi
          echo "PASS: missing/corrupt delivery source fail closed"

      - name: Upload Martin receipts on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: martin-canary-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  frontend-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend
        working-directory: server/frontend
        run: npm ci
      - name: Lint and typecheck
        working-directory: server/frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Build Martin canary mode
        working-directory: server/frontend
        env:
          VITE_MUNICIPIOS_DELIVERY: martin
        run: npm run build
      - name: Build GeoJSON rollback mode
        working-directory: server/frontend
        env:
          VITE_MUNICIPIOS_DELIVERY: geojson
        run: npm run build
