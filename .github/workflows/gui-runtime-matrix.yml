name: GUI runtime matrix

on:
  push:
    branches:
      - audit/mobile-workbench-remediation-20260824
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARTIN_ASSET_URL: https://github.com/maplibre/martin/releases/download/martin-v1.13.0/martin-x86_64-unknown-linux-musl.tar.gz
      MARTIN_ASSET_SHA256: 96d6415ca3b18f843eb0ef28f44d34b96c494b192e9ef7e7289b3bc88612009d
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and geo dependencies
        working-directory: .
        run: |
          python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[server,geo]" PyYAML
      - name: Download and verify Martin 1.13.0
        working-directory: .
        run: |
          curl --fail --location --retry 3 "$MARTIN_ASSET_URL" -o /tmp/martin.tar.gz
          echo "$MARTIN_ASSET_SHA256  /tmp/martin.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/martin-bin
          tar -xzf /tmp/martin.tar.gz -C /tmp/martin-bin
          MARTIN_BIN="$(find /tmp/martin-bin -type f -name martin -perm -111 | head -n 1)"
          test -n "$MARTIN_BIN"
          echo "MARTIN_BIN=$MARTIN_BIN" >> "$GITHUB_ENV"
          "$MARTIN_BIN" --version
      - name: Build municipios delivery fixture
        working-directory: .
        run: |
          sudo mkdir -p /spiderweb-data
          sudo chown "$USER":"$USER" /spiderweb-data
          python scripts/build_martin_canary_fixture.py --output /spiderweb-data/municipios.geojson
          python scripts/build_martin_delivery_artifact.py \
            --source /spiderweb-data/municipios.geojson \
            --output /spiderweb-data/municipios.delivery.geojson \
            --receipt /tmp/municipios-delivery-receipt.json
      - name: Generate Martin config and start Martin
        working-directory: .
        run: |
          python scripts/build_martin_config.py --environment certification \
            --output /tmp/martin-cert.yaml --manifest /tmp/martin-cert.manifest.json
          "$MARTIN_BIN" --config /tmp/martin-cert.yaml >/tmp/martin.log 2>&1 &
          echo $! > /tmp/martin.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/martin.log
          exit 1
      - name: Initialize backend database
        working-directory: .
        run: sqlite3 server/priis.db < server/database/schema_sqlite.sql
      - name: Start FastAPI backend
        working-directory: .
        run: |
          python -m uvicorn server.backend.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/spiderweb-backend.log 2>&1 &
          echo $! > /tmp/spiderweb-backend.pid
          for i in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8000/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/spiderweb-backend.log
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start workbench
        shell: bash
        env:
          VITE_API_BASE: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/spiderweb-vite.log 2>&1 &
          echo $! > /tmp/spiderweb-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/spiderweb-vite.log
          exit 1
      - name: Execute six-module matrix
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          XVFB_PID=$!
          sleep 1
          DISPLAY=:99 node tests/gui-runtime-matrix.mjs; STATUS=$?
          kill "$XVFB_PID" 2>/dev/null || true
          exit $STATUS
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spiderweb-gui-runtime-matrix
          path: server/frontend/artifacts/gui-runtime-matrix/
          if-no-files-found: error
          retention-days: 90
      - name: Dump server logs on failure
        if: failure()
        run: |
          cat /tmp/spiderweb-vite.log || true
          cat /tmp/spiderweb-backend.log || true
          cat /tmp/martin.log || true
