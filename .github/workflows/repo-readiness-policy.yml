name: Repository readiness policy

on:
  push:
    paths:
      - '.federation/repo-readiness-policy.json'
      - 'audit/repo_readiness/**'
      - 'scripts/check_repo_readiness_policy.py'
      - 'tests/test_repo_readiness_policy.py'
      - '.github/workflows/repo-readiness-policy.yml'
  pull_request:
    paths:
      - '.federation/repo-readiness-policy.json'
      - 'audit/repo_readiness/**'
      - 'scripts/check_repo_readiness_policy.py'
      - 'tests/test_repo_readiness_policy.py'
      - '.github/workflows/repo-readiness-policy.yml'

permissions:
  contents: read

jobs:
  readiness-claim-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Validate policy and frozen snapshot
        run: >-
          python scripts/check_repo_readiness_policy.py
          --report audit/repo_readiness/2026-08-24.json
      - name: Run readiness policy regression tests
        run: |
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -c constraints.txt pytest
          python -m pytest tests/test_repo_readiness_policy.py -q
