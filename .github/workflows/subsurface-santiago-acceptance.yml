name: Subsurface Santiago Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "spiderweb/subsurface/**"
      - "tests/fixtures/subsurface/santiago_triangle.kml"
      - ".github/workflows/subsurface-santiago-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: subsurface-santiago-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-santiago-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Spiderweb
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run frozen Santiago Triangle against v0.4 public denominator
        run: |
          python -m spiderweb.subsurface.cli \
            tests/fixtures/subsurface/santiago_triangle.kml \
            --out artifacts/santiago-v04 \
            --run-sources \
            | tee artifacts/santiago-v04.console.json

      - name: Summarize receipts and gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('artifacts/santiago-v04')
          control = json.loads((root / 'source_control.json').read_text())
          cert = json.loads((root / 'public_exhaustion.json').read_text())
          ledger = control['ledger']
          states = Counter(row['run_state'] for row in ledger)
          print('SOURCE STATES:', dict(sorted(states.items())))
          print('REQUIRED:', cert['required_sources'])
          print('TERMINAL:', cert['terminal_sources'])
          print('PUBLIC_EXHAUSTION:', cert['state'])
          print('RECORDS_REQUEST_ELIGIBLE:', cert['records_request_eligible'])
          print('UNRESOLVED:', len(cert['unresolved_sources']))
          # This acceptance run must never silently promote a still-open denominator.
          assert cert['records_request_eligible'] is False
          PY

      - name: Upload Santiago v0.4 receipts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: santiago-subsurface-v04-${{ github.run_id }}
          path: artifacts/santiago-v04
          if-no-files-found: error
          retention-days: 30
