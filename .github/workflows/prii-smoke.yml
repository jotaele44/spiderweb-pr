name: PRII Smoke Gate

on:
  push:
    branches:
      - main
      - "prii/**"
  pull_request:
    branches:
      - main

# Cancel superseded in-flight runs on the same ref (T6-54).
concurrency:
  group: prii-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prii-smoke:
    name: PRII readiness smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PRII smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema==4.26.0" "pyarrow>=14.0" "pytest>=7.4" "Pillow>=10.0" "numpy>=1.26"

      - name: Compile PRII modules
        run: |
          python -m py_compile \
            run_all.py \
            readiness/prii_readiness_engine.py \
            integration/pr_intel_adapter.py \
            integration/schema_validation.py \
            pipeline/operational_intelligence.py \
            pipeline/hardening_layer.py \
            readiness/calibrate_scoring.py \
            readiness/spiderweb_intake.py \
            readiness/satellite_ingest.py \
            scripts/validate_satellite_batch.py

      - name: Validate schemas loadable
        run: |
          python -c "
          from integration.schema_validation import SchemaValidator
          v = SchemaValidator()
          schemas = v.available_schemas()
          assert len(schemas) >= 11, f'Expected >=11 schemas, got {len(schemas)}: {schemas}'
          assert 'satellite_source_manifest' in schemas, 'satellite_source_manifest not loaded'
          print(f'OK: {len(schemas)} schemas loaded')
          "

      - name: Run satellite schema contract tests
        run: |
          python -m pytest \
            tests/test_satellite_source_manifest_schema.py \
            tests/test_new_schemas.py \
            tests/test_satellite_ingest.py \
            -v --tb=short

      - name: Run terrain utility tests
        run: |
          python -m pip install "scipy>=1.11" "numpy>=1.26"
          python -m pytest tests/test_terrain.py -v --tb=short

      - name: Run PRII readiness and CLI tests
        run: |
          python -m pytest \
            tests/test_prii_readiness_engine.py \
            tests/test_cli_readiness.py \
            tests/test_schema_validation.py \
            -v --tb=short

      - name: Validate satellite batch script
        run: |
          python -c "
          import json, pathlib, tempfile, os
          m = {'manifest_id':'CI-001','schema_version':'1.0','producer':'ci','created_at':'2024-01-01T00:00:00Z','synthetic':True,'source':{'provider':'ESA','collection':'s2','platform':'Sentinel-2A','instrument':'MSI'},'acquisition':{'acquired_at':'2024-01-01T00:00:00Z','processed_at':'2024-01-01T01:00:00Z','license':'Open'},'asset':{'source_uri':'s3://bucket/img.tif','checksum_sha256':'a'*64,'media_type':'image/tiff'},'geometry':{'crs':'EPSG:4326','footprint':{'type':'Polygon','coordinates':[[[-67,18],[-66,18],[-66,18.5],[-67,18.5],[-67,18]]]},'bbox':[-67,18,-66,18.5]},'puerto_rico':{'region':'mainland'},'quality':{'cloud_cover_pct':5,'geometric_confidence':0.9,'source_reliability':'high'},'lineage':{'processing_pipeline':'ci-test-v1'}}
          with tempfile.TemporaryDirectory() as d:
              pathlib.Path(d, 'manifest.json').write_text(json.dumps(m))
              rc = os.system(f'python -m scripts.validate_satellite_batch {d} --dry-run')
          assert rc == 0, f'Batch validator exited {rc}'
          print('Batch validator OK')
          "

      - name: Health check — schemas and DB guards
        run: |
          python -c "
          from integration.schema_validation import SchemaValidator
          v = SchemaValidator()
          assert len(v.available_schemas()) >= 11
          print('Schema health OK')
          "

      - name: Validate prii_readiness_report schema has satellite_manifests gate
        run: |
          python -c "
          import json
          schema = json.load(open('schemas/prii_readiness_report.schema.json'))
          gates = schema['properties']['gates']['properties']
          assert 'satellite_manifests' in gates, 'satellite_manifests gate missing'
          print('Readiness report schema OK')
          "
