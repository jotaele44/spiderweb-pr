name: PRII Smoke Gate

on:
  push:
    branches:
      - main
      - "prii/**"
  pull_request:
    branches:
      - main

jobs:
  prii-smoke:
    name: PRII readiness smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PRII smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.17" "pyarrow>=14.0" "pytest>=7.4" "Pillow>=10.0" "numpy>=1.26"

      - name: Compile PRII modules
        run: |
          python -m py_compile \
            run_all.py \
            prii_readiness_engine.py \
            pr_intel_adapter.py \
            schema_validation.py \
            geo_calibration.py

      - name: Run PRII readiness and CLI tests
        run: |
          python -m pytest \
            tests/test_prii_readiness_engine.py \
            tests/test_cli_readiness.py \
            -v --tb=short
