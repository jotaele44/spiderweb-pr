name: PR Hydrography Acquisition

on:
  pull_request:
    paths:
      - 'scripts/source_adapters/pr_hydrography/**'
      - 'manifests/pr_hydrography/**'
      - 'tests/test_pr_hydrography_*.py'
      - '.github/workflows/pr-hydrography.yml'
  workflow_dispatch:
    inputs:
      probe_live_sources:
        description: 'Probe authoritative endpoints without retaining raw payloads as canonical storage'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'pytest>=9,<10' 'shapely>=2.1,<3'
      - name: Compile acquisition plane
        run: |
          python -m py_compile scripts/source_adapters/pr_hydrography/core.py
          python -m py_compile scripts/source_adapters/pr_hydrography/validation.py
          python -m py_compile scripts/source_adapters/pr_hydrography/cli.py
          python -m py_compile scripts/source_adapters/pr_hydrography/resolver.py
          python -m py_compile scripts/source_adapters/pr_hydrography/control_plane.py
          python -m py_compile scripts/source_adapters/pr_hydrography/certifiers.py
          python -m py_compile scripts/source_adapters/pr_hydrography/spine.py
          python -m py_compile scripts/source_adapters/pr_hydrography/transport.py
      - name: Run offline certification regressions
        run: pytest -q tests/test_pr_hydrography_acquisition.py tests/test_pr_hydrography_resolver.py tests/test_pr_hydrography_max_vector.py

  freshness-probe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.probe_live_sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe source metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          urls = {
              'USGS_NHD_SERVICE': 'https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer?f=pjson',
              'USACE_NID_SERVICE': 'https://geospatial.sec.usace.army.mil/dls/rest/services/NID/National_Inventory_of_Dams_Public_Service/FeatureServer?f=pjson',
              'USGS_INLAND_BATHY_V4': 'https://www.sciencebase.gov/catalog/item/5fce600bd34e30b912396ad0?format=json',
              'TIGER_2025_STATE': 'https://www2.census.gov/geo/tiger/TIGER2025/STATE/',
          }
          results = []
          for source_id, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent': 'spiderweb-pr-hydrography-probe/0.1'})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      head = response.read(4096)
                      results.append({
                          'source_id': source_id,
                          'url': url,
                          'status': getattr(response, 'status', ''),
                          'content_type': response.headers.get('Content-Type', ''),
                          'etag': response.headers.get('ETag', ''),
                          'last_modified': response.headers.get('Last-Modified', ''),
                          'probe_bytes': len(head),
                          'state': 'REACHABLE',
                      })
              except Exception as exc:
                  results.append({'source_id': source_id, 'url': url, 'state': 'UNREACHABLE', 'error': str(exc)})
          report = {
              'generated_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'notice': 'Freshness probe only. This artifact is not a canonical raw-byte snapshot and cannot promote canonical state.',
              'canonical_promotion_permitted': False,
              'results': results,
          }
          with open('pr_hydrography_freshness_probe.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2)
          print(json.dumps(report, indent=2))
          if any(row['state'] != 'REACHABLE' for row in results):
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-hydrography-freshness-probe
          path: pr_hydrography_freshness_probe.json
          retention-days: 14
