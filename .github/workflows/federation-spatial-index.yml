name: Federation Spatial Index

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: federation-spatial-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spatial-index:
    name: spatial-index-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      # The frozen grid is the federation's address space. Bytes first.
      - name: Grid baseline (GRID_SHA_GATE)
        run: python scripts/validate_pr_grid.py --require-sha

      # The geometry layer is a build product, so CI rebuilds it and compares the
      # content hash rather than trusting a tracked file.
      - name: Rebuild geometry layer (GEOMETRY_SHA_GATE)
        run: |
          expected="$(python -c "import json;print(json.load(open('registry/spatial/geometry/pr_grid_geometry_manifest.json'))['sha256'])")"
          python -m pipeline.build_cell_geometry >/dev/null
          actual="$(python -c "import json;print(json.load(open('registry/spatial/geometry/pr_grid_geometry_manifest.json'))['sha256'])")"
          if [ "$expected" != "$actual" ]; then
            echo "geometry layer is not reproducible: $expected != $actual" >&2
            exit 1
          fi
          echo "geometry reproducible: $actual"

      - name: Registry gates
        run: python scripts/validate_spatial_registry.py

      - name: Spatial index tests
        run: python -m pytest tests/test_federation_spatial_index.py -q

      # The documented bounds must keep failing. If this ever passes, either the
      # bounds were corrected upstream or an assertion was weakened; both need a
      # human to look rather than a silent green build.
      - name: Documented bounds remain rejected (regression)
        run: |
          if python -m pipeline.grid_georeference --check-bounds=-67.30,17.92,-65.20,18.65; then
            echo "documented bounds unexpectedly certified - re-examine the transform" >&2
            exit 1
          fi
          echo "documented bounds correctly rejected"
