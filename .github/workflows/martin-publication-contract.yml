name: Martin publication contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/martin-publication-contract.yml"
      - "configs/martin_delivery.yaml"
      - "configs/layer_catalog.yaml"
      - "schemas/tile_source_delivery.schema.json"
      - "martin/**"
      - "scripts/build_martin_config.py"
      - "scripts/build_martin_delivery_artifact.py"
      - "scripts/build_martin_canary_fixture.py"
      - "scripts/check_martin_promotion.py"
      - "scripts/check_martin_ingress_contract.py"
      - "server/backend/martin_ingress.py"
      - "server/backend/production.py"
      - "tests/test_martin_publication_contract.py"

permissions:
  contents: read

concurrency:
  group: martin-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[geo,server]" PyYAML pytest jsonschema

      - name: Validate delivery registry schema
        run: |
          python - <<'PY'
          import json
          import yaml
          from jsonschema import Draft202012Validator
          schema=json.load(open('schemas/tile_source_delivery.schema.json', encoding='utf-8'))
          registry=yaml.safe_load(open('configs/martin_delivery.yaml', encoding='utf-8'))
          Draft202012Validator(schema).validate(registry)
          print('PASS: martin delivery registry schema')
          PY

      - name: State machine, compiler, ingress and prohibition tests
        run: pytest -q tests/test_martin_publication_contract.py

      - name: Rebuild canonical and sanitize public delivery properties
        run: |
          sudo mkdir -p /spiderweb-data
          sudo chown "$USER":"$USER" /spiderweb-data
          python scripts/build_martin_canary_fixture.py --output /spiderweb-data/municipios.geojson
          python scripts/build_martin_delivery_artifact.py \
            --source /spiderweb-data/municipios.geojson \
            --output /spiderweb-data/municipios.delivery.geojson \
            --receipt /tmp/municipios-delivery-receipt.json | tee /tmp/municipios-delivery.stdout
          python - <<'PY'
          import json
          r=json.load(open('/tmp/municipios-delivery-receipt.json', encoding='utf-8'))
          assert r['canonical_sha256']=='adebd4e779e36ca4aecb69291af9e153e430a829cc4ca8a676f7d5f5197a5d76'
          assert r['feature_count']==78 and r['identity_count']==78
          assert r['symmetric_difference_count']==0
          assert r['source_only']==[] and r['delivery_only']==[]
          assert r['public_properties']==['GEOID','NAME']
          assert r['unexpected_properties']==[]
          print('PASS: 78 canonical == 78 delivery; unexpected public properties=0')
          print('DELIVERY_SHA256='+r['delivery_sha256'])
          PY

      - name: Deterministic environment-specific config generation
        run: |
          for env in canary certification production; do
            python scripts/build_martin_config.py --environment "$env" --output "/tmp/$env-a.yaml" --manifest "/tmp/$env-a.json"
            python scripts/build_martin_config.py --environment "$env" --output "/tmp/$env-b.yaml" --manifest "/tmp/$env-b.json"
            cmp "/tmp/$env-a.yaml" "/tmp/$env-b.yaml"
          done
          python - <<'PY'
          import yaml
          canary=yaml.safe_load(open('/tmp/canary-a.yaml', encoding='utf-8'))
          cert=yaml.safe_load(open('/tmp/certification-a.yaml', encoding='utf-8'))
          prod=yaml.safe_load(open('/tmp/production-a.yaml', encoding='utf-8'))
          assert set(canary['geojson']['sources'])=={'municipios'}
          assert set(cert['geojson']['sources'])=={'municipios'}
          assert set(prod['geojson']['sources'])=={'municipios'}
          for c in (canary,cert,prod): assert 'paths' not in c['geojson']
          print('PASS: production config admits exactly the published source set')
          PY

      - name: Non-mutating promotion eligibility receipt
        run: |
          before="$(sha256sum configs/martin_delivery.yaml | cut -d' ' -f1)"
          python scripts/check_martin_promotion.py --source municipios --target quarantined --receipt /tmp/promotion-check.json
          after="$(sha256sum configs/martin_delivery.yaml | cut -d' ' -f1)"
          test "$before" = "$after"
          python - <<'PY'
          import json, yaml
          r=json.load(open('/tmp/promotion-check.json', encoding='utf-8'))
          registry=yaml.safe_load(open('configs/martin_delivery.yaml', encoding='utf-8'))
          assert r['mutation_performed'] is False
          assert registry['sources']['municipios']['publication_state']=='published'
          print('PASS: rollback-eligibility check creates receipt but performs no mutation')
          PY

      - name: Production same-origin ingress contract
        run: python scripts/check_martin_ingress_contract.py

      - name: Production entrypoint serves exactly the published Martin sources
        run: |
          python -m uvicorn server.backend.production:app --host 127.0.0.1 --port 18002 >/tmp/production-api.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            code="$(curl -s -o /tmp/martin-health.json -w '%{http_code}' http://127.0.0.1:18002/health/martin-delivery || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/martin-health.json', encoding='utf-8'))
          assert p['authorized_published_source_count']==1
          assert p['authorized_published_sources']==['municipios']
          assert p['arbitrary_proxy_target'] is False
          print('PASS: production ingress authorizes exactly municipios')
          PY
          # Published, but no Martin upstream is running in this job step: the
          # ingress proxies the request and gets a connection failure, so 503
          # (upstream unavailable) — not 404 — is the correct signal here.
          test "$(curl -s -o /tmp/published.json -w '%{http_code}' http://127.0.0.1:18002/tiles/municipios)" = "503"
          # An unpublished/unknown source id must still be rejected outright.
          test "$(curl -s -o /tmp/unpublished.json -w '%{http_code}' http://127.0.0.1:18002/tiles/not-a-real-source)" = "404"
          kill "$pid" || true

      - name: Upload closure receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: martin-publication-contract-receipts
          path: |
            /tmp/*-receipt.json
            /tmp/*-a.json
            /tmp/production-api.log
          if-no-files-found: ignore
