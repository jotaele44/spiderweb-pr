name: GUI executability audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-executability-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run auditor regression gates
        run: python -m pytest -q tests/test_gui_executability_auditor.py
      - name: Emit bounded GUI capability ledger
        run: python scripts/audit_gui_executability.py
      - name: Verify ledger is closed and parseable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('audit/executability/gui-capability-ledger.json')
          ledger = json.loads(path.read_text())
          assert ledger['audit_mode'] == 'STATIC_NO_TARGET_EXECUTION'
          assert ledger['invariants']['pass'] is True
          assert ledger['coverage']['discovered_manifestations'] == ledger['coverage']['classified_manifestations']
          assert sum(ledger['coverage']['by_final_state'].values()) == ledger['coverage']['discovered_manifestations']
          print(json.dumps(ledger['coverage'], sort_keys=True))
          PY
      - name: Upload capability ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spiderweb-gui-executability-ledger
          path: audit/executability/gui-capability-ledger.json
          if-no-files-found: error
          retention-days: 90
