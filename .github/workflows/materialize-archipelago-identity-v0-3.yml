name: Materialize canonical archipelago identity graph v0.3

on:
  push:
    branches:
      - feat/archipelago-identity-v0-3
    paths:
      - .federation/run_archipelago_identity_v0_3

permissions:
  contents: write

concurrency:
  group: archipelago-identity-v0-3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct reviewed source bundle
        run: |
          set -euo pipefail
          python scripts/bootstrap_archipelago_identity_v0_3.py
          rm -rf .federation/archipelago_identity_v0_3
          rm scripts/bootstrap_archipelago_identity_v0_3.py

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest shapely

      - name: Download and verify frozen source snapshot
        env:
          SNAPSHOT_URL: https://github.com/jotaele44/spiderweb-pr/releases/download/pr-archipelago-freeze-2026-08-22/pr-archipelago-current-snapshot.zip
          SNAPSHOT_SHA256: 6e8a29fc87178264584c5e88add8ac63d8e0e9a72b9f05f63795c6edec2c92e4
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors "$SNAPSHOT_URL" -o "$RUNNER_TEMP/pr-archipelago-current-snapshot.zip"
          printf '%s  %s\n' "$SNAPSHOT_SHA256" "$RUNNER_TEMP/pr-archipelago-current-snapshot.zip" | sha256sum --check --strict

      - name: Build canonicalization graph and blocked release candidate
        run: |
          set -euo pipefail
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/materialize_pr_archipelago_identity_graph_v0_3.py \
            --snapshot-zip "$RUNNER_TEMP/pr-archipelago-current-snapshot.zip" \
            --producer-head f46546ef24c7dc2164b3f203d1af57e7d2570219 \
            --generated-at "$GENERATED_AT"

      - name: Run bounded positive and negative regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_archipelago_identity_graph_v0_3.py \
            tests/test_offshore_classifier_v0_3.py

      - name: Commit reviewed and generated artifacts
        run: |
          set -euo pipefail
          git config user.name "spiderweb-archipelago-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: materialize bounded archipelago identity graph v0.3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
