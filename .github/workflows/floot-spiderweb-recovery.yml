name: Floot Spiderweb Exact Recovery

on:
  push:
    branches:
      - recovery/floot-spiderweb-20260929
    paths:
      - .recovery/**
      - .github/workflows/floot-spiderweb-recovery.yml

permissions:
  contents: read

jobs:
  exact-frozen-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spiderweb_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spiderweb_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_B64_SHA256: b02533910bf0e9118a189988b008431132b88111f240552265f8ee13c3cbda98
      EXPECTED_ZIP_SHA256: 7746bf2da3fc9a7d59e0e0a495120068e2ec7d15499c7778ff9a8a00fb1c9ad9
      EXPECTED_GIT_TREE: 9b493e2ce8f881dee8b49497f0105da8b805a1a4
      RECOVERY_B64: .recovery/floot-spiderweb-20260929.zip.b64
      FLOOT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/spiderweb_recovery
      JWT_SECRET: recovery-only-jwt-secret-not-production-20260929
      SPIDERWEB_API_BASE_URL: https://authority.example.test
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact transported archive
        shell: bash
        run: |
          set -euo pipefail
          actual_b64="$(sha256sum "$RECOVERY_B64" | awk '{print $1}')"
          test "$actual_b64" = "$EXPECTED_B64_SHA256"
          base64 --decode "$RECOVERY_B64" > /tmp/spiderweb-floot.zip
          actual_zip="$(sha256sum /tmp/spiderweb-floot.zip | awk '{print $1}')"
          test "$actual_zip" = "$EXPECTED_ZIP_SHA256"
          rm -rf /tmp/spiderweb-frozen
          mkdir -p /tmp/spiderweb-frozen
          unzip -q /tmp/spiderweb-floot.zip -d /tmp/spiderweb-frozen
          cd /tmp/spiderweb-frozen
          git init -q
          git config user.name recovery
          git config user.email recovery@example.invalid
          git config core.autocrlf false
          git add -A
          actual_tree="$(git write-tree)"
          echo "actual_tree=$actual_tree"
          test "$actual_tree" = "$EXPECTED_GIT_TREE"
          rm -rf .git

      - name: Prepare isolated mutable reconstruction copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/spiderweb-work
          cp -a /tmp/spiderweb-frozen /tmp/spiderweb-work
          mkdir -p "$GITHUB_WORKSPACE/.recovery/artifacts"
          cp /tmp/spiderweb-work/package.json "$GITHUB_WORKSPACE/.recovery/artifacts/package.original.json"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "zip_sha256=$EXPECTED_ZIP_SHA256"
            echo "git_tree=$EXPECTED_GIT_TREE"
            echo "spec_files_discovered=$(find /tmp/spiderweb-work/helpers -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' \) | wc -l | tr -d ' ')"
            echo "empty_spec_files=$(find /tmp/spiderweb-work/helpers -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' \) -size -20c | wc -l | tr -d ' ')"
          } | tee "$GITHUB_WORKSPACE/.recovery/artifacts/environment.txt"
          find /tmp/spiderweb-work/helpers -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' \) -print | sort             > "$GITHUB_WORKSPACE/.recovery/artifacts/spec-files.txt"

      - name: Restore application dependency graph
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/spiderweb-work
          npm install --ignore-scripts --legacy-peer-deps 2>&1 | tee "$GITHUB_WORKSPACE/.recovery/artifacts/npm-install-app.log"
          npm install --save-dev --ignore-scripts --legacy-peer-deps \
            vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.2.0 @testing-library/dom@10.4.1 \
            2>&1 | tee "$GITHUB_WORKSPACE/.recovery/artifacts/npm-install-test-harness.log"
          cp package.json "$GITHUB_WORKSPACE/.recovery/artifacts/package.reconstructed.json"
          cp package-lock.json "$GITHUB_WORKSPACE/.recovery/artifacts/package-lock.json"
          sha256sum \
            "$GITHUB_WORKSPACE/.recovery/artifacts/package.original.json" \
            "$GITHUB_WORKSPACE/.recovery/artifacts/package.reconstructed.json" \
            "$GITHUB_WORKSPACE/.recovery/artifacts/package-lock.json" \
            | tee "$GITHUB_WORKSPACE/.recovery/artifacts/dependency-sha256.txt"

      - name: Create Jasmine-compatible recovery harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spiderweb-work/vitest.recovery.setup.mjs <<'EOF'
          import { afterEach, expect, vi } from "vitest";

          expect.extend({
            toBeTrue(received) {
              const pass = received === true;
              return { pass, message: () => `expected ${received} to be true` };
            },
            toBeFalse(received) {
              const pass = received === false;
              return { pass, message: () => `expected ${received} to be false` };
            },
          });

          function augmentSpy(spy) {
            Object.defineProperty(spy, "and", {
              configurable: true,
              value: {
                returnValue(value) {
                  spy.mockReturnValue(value);
                  return spy;
                },
                resolveTo(value) {
                  spy.mockResolvedValue(value);
                  return spy;
                },
                rejectWith(value) {
                  spy.mockRejectedValue(value);
                  return spy;
                },
                callFake(fn) {
                  spy.mockImplementation(fn);
                  return spy;
                },
              },
            });
            Object.defineProperty(spy, "calls", {
              configurable: true,
              value: {
                mostRecent() {
                  const args = spy.mock.calls.at(-1) ?? [];
                  return { args };
                },
                count() {
                  return spy.mock.calls.length;
                },
                allArgs() {
                  return [...spy.mock.calls];
                },
              },
            });
            return spy;
          }

          globalThis.spyOn = (object, method) => augmentSpy(vi.spyOn(object, method));
          globalThis.jasmine = {
            createSpy(name) {
              const spy = vi.fn();
              try {
                Object.defineProperty(spy, "name", { value: name, configurable: true });
              } catch {}
              return augmentSpy(spy);
            },
            any(constructor) {
              return expect.any(constructor);
            },
          };

          if (typeof window !== "undefined" && typeof window.matchMedia !== "function") {
            Object.defineProperty(window, "matchMedia", {
              configurable: true,
              writable: true,
              value: (query) => ({
                matches: false,
                media: query,
                onchange: null,
                addListener: vi.fn(),
                removeListener: vi.fn(),
                addEventListener: vi.fn(),
                removeEventListener: vi.fn(),
                dispatchEvent: vi.fn(() => false),
              }),
            });
          }

          afterEach(() => {
            vi.restoreAllMocks();
          });
          EOF

          cat > /tmp/spiderweb-work/vitest.recovery.config.mjs <<'EOF'
          import { defineConfig } from "vitest/config";
          import react from "@vitejs/plugin-react-swc";
          export default defineConfig({
            plugins: [react()],
            test: {
              globals: true,
              environment: "jsdom",
              setupFiles: ["./vitest.recovery.setup.mjs"],
              include: ["helpers/**/*.spec.ts", "helpers/**/*.spec.tsx"],
              exclude: ["helpers/useDebounce.spec.tsx"],
            },
          });
          EOF
          cp /tmp/spiderweb-work/vitest.recovery.config.mjs "$GITHUB_WORKSPACE/.recovery/artifacts/vitest.recovery.config.mjs"
          cp /tmp/spiderweb-work/vitest.recovery.setup.mjs "$GITHUB_WORKSPACE/.recovery/artifacts/vitest.recovery.setup.mjs"

      - name: Execute recovered Spiderweb specs
        id: tests
        shell: bash
        run: |
          set -uo pipefail
          cd /tmp/spiderweb-work
          ./node_modules/.bin/vitest run --config vitest.recovery.config.mjs --reporter=verbose \
            2>&1 | tee "$GITHUB_WORKSPACE/.recovery/artifacts/vitest.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee "$GITHUB_WORKSPACE/.recovery/artifacts/vitest.exit-code.txt"
          exit "$status"

      - name: Execute 21-endpoint auth/database recovery regression
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.recovery/spiderweb-reconstruction-schema.sql" /tmp/spiderweb-work/recovery.schema.sql
          cp "$GITHUB_WORKSPACE/.recovery/spiderweb-endpoint-regression.ts" /tmp/spiderweb-work/recovery.endpoint.spec.ts
          cp /tmp/spiderweb-work/recovery.schema.sql "$GITHUB_WORKSPACE/.recovery/artifacts/recovery.schema.sql"
          cp /tmp/spiderweb-work/recovery.endpoint.spec.ts "$GITHUB_WORKSPACE/.recovery/artifacts/recovery.endpoint.spec.ts"
          cd /tmp/spiderweb-work
          find endpoints -type f -name '*.ts' ! -name '*.schema.ts' -print | sort | tee "$GITHUB_WORKSPACE/.recovery/artifacts/endpoint-files.txt"
          endpoint_count="$(wc -l < "$GITHUB_WORKSPACE/.recovery/artifacts/endpoint-files.txt" | tr -d ' ')"
          test "$endpoint_count" = "21"
          cat > vitest.endpoint.config.mjs <<'EOF'
          import { defineConfig } from "vitest/config";
          import react from "@vitejs/plugin-react-swc";
          export default defineConfig({
            plugins: [react()],
            test: {
              globals: true,
              environment: "node",
              include: ["recovery.endpoint.spec.ts"],
              testTimeout: 20000,
              hookTimeout: 20000,
              sequence: { concurrent: false },
            },
          });
          EOF
          cp vitest.endpoint.config.mjs "$GITHUB_WORKSPACE/.recovery/artifacts/vitest.endpoint.config.mjs"
          ./node_modules/.bin/vitest run --config vitest.endpoint.config.mjs --reporter=verbose \
            2>&1 | tee "$GITHUB_WORKSPACE/.recovery/artifacts/endpoint-regression.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee "$GITHUB_WORKSPACE/.recovery/artifacts/endpoint-regression.exit-code.txt"
          exit "$status"

      - name: Freeze recovery receipt
        if: always()
        shell: bash
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          {
            echo "archive_sha256=$EXPECTED_ZIP_SHA256"
            echo "archive_base64_sha256=$EXPECTED_B64_SHA256"
            echo "source_git_tree=$EXPECTED_GIT_TREE"
            echo "dependency_step=${{ steps.deps.outcome }}"
            echo "test_step=${{ steps.tests.outcome }}"
            echo "endpoint_step=${{ steps.endpoints.outcome }}"
            echo "reconstruction_schema_class=NEW_NONCANONICAL_TYPE_AND_QUERY_DERIVED_NO_HISTORICAL_ROWS"
            echo "reconstruction_harness=vitest@3.2.4 jsdom@26.1.0 testing-library-react@16.2.0 testing-library-dom@10.4.1 jasmine-compat-v2 archive-react-swc matchMedia-default"
            echo "empty_placeholder_spec=helpers/useDebounce.spec.tsx"
            echo "classification=RECONSTRUCTION_EXECUTION_NOT_HISTORICAL_DEPENDENCY_IDENTITY"
          } > .recovery/artifacts/recovery-receipt.txt
          find .recovery/artifacts -maxdepth 1 -type f ! -name artifact-sha256.txt -print0 | sort -z | xargs -0 sha256sum \
            > .recovery/artifacts/artifact-sha256.txt
          cat .recovery/artifacts/recovery-receipt.txt
          cat .recovery/artifacts/artifact-sha256.txt

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floot-spiderweb-exact-recovery
          path: .recovery/artifacts/
          if-no-files-found: error
          retention-days: 30
