name: Exact Floot recovery — Spiderweb

on:
  push:
    branches:
      - recovery/floot-baseline-2026-09-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-floot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reassemble exact recovered payload
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/spiderweb-exact/part-000 \
              .recovery/spiderweb-exact/part-001 \
              .recovery/spiderweb-exact/part-002 \
              .recovery/spiderweb-exact/part-003 \
            > "$RUNNER_TEMP/spiderweb_exact.tar.gz"
          echo "b5e8c8ce51d221819d4f0040bcde5eeb984769cab2fd3165cad7082802723815  $RUNNER_TEMP/spiderweb_exact.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/recovered"
          tar -xzf "$RUNNER_TEMP/spiderweb_exact.tar.gz" -C "$RUNNER_TEMP/recovered"

      - name: Verify all 272 recovered member bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("${{ runner.temp }}") / "recovered"
          manifest = Path(".recovery/spiderweb-exact/member_manifest.txt")
          expected = {}
          for line in manifest.read_text().splitlines():
              if not line.strip():
                  continue
              sha, size, path = line.split("  ", 2)
              expected[path] = (int(size), sha)

          actual_files = sorted(
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file()
          )
          if set(actual_files) != set(expected):
              missing = sorted(set(expected) - set(actual_files))
              extra = sorted(set(actual_files) - set(expected))
              raise SystemExit(f"member-set mismatch missing={missing} extra={extra}")

          for rel in actual_files:
              data = (root / rel).read_bytes()
              size, sha = expected[rel]
              got = hashlib.sha256(data).hexdigest()
              if len(data) != size or got != sha:
                  raise SystemExit(f"member mismatch {rel}: expected size={size} sha={sha}, got size={len(data)} sha={got}")

          if len(actual_files) != 272:
              raise SystemExit(f"expected 272 recovered files, got {len(actual_files)}")
          print("EXACT_MEMBER_VERIFICATION=PASS")
          print("RECOVERED_FILE_COUNT=272")
          PY

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Construct new reconstruction dependency lock
        shell: bash
        working-directory: ${{ runner.temp }}/recovered
        run: |
          set -euo pipefail
          cp package.json package.original.json
          sha256sum package.original.json > recovery-package-hashes.txt
          npm install --no-audit --no-fund --ignore-scripts
          npm install --save-dev --no-audit --no-fund --ignore-scripts \
            vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.2.0
          sha256sum package.json package-lock.json >> recovery-package-hashes.txt
          node -v > recovery-environment.txt
          npm -v >> recovery-environment.txt

      - name: Add reconstruction-only Floot test harness
        shell: bash
        working-directory: ${{ runner.temp }}/recovered
        run: |
          set -euo pipefail
          cat > recovery.vitest.config.mts <<'EOF'
          import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              globals: true,
              environment: "jsdom",
              include: ["helpers/**/*.spec.ts", "helpers/**/*.spec.tsx"],
              setupFiles: ["./recovery.vitest.setup.mjs"],
              restoreMocks: true,
              clearMocks: true,
            },
          });
          EOF

          cat > recovery.vitest.setup.mjs <<'EOF'
          import { vi } from "vitest";

          function jasmineCompatSpy(spy) {
            const api = spy;
            api.and = {
              returnValue(value) {
                spy.mockReturnValue(value);
                return api;
              },
              resolveTo(value) {
                spy.mockResolvedValue(value);
                return api;
              },
              callFake(fn) {
                spy.mockImplementation(fn);
                return api;
              },
            };
            api.calls = {
              mostRecent() {
                const args = spy.mock.calls.at(-1) ?? [];
                return { args };
              },
              count() {
                return spy.mock.calls.length;
              },
            };
            return api;
          }

          globalThis.spyOn = (target, key) => jasmineCompatSpy(vi.spyOn(target, key));
          globalThis.jasmine = {
            createSpy(name) {
              return jasmineCompatSpy(vi.fn().mockName(name));
            },
          };
          EOF

          sha256sum recovery.vitest.config.mts recovery.vitest.setup.mjs >> recovery-package-hashes.txt

      - name: Execute recovered Floot specifications
        id: recovered_tests
        shell: bash
        working-directory: ${{ runner.temp }}/recovered
        run: |
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose 2>&1 | tee recovery-vitest.log
          status=${PIPESTATUS[0]}
          echo "$status" > recovery-test-exit.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inventory executed recovered specs
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/recovered
        run: |
          set -euo pipefail
          find helpers -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' \) -print | sort > recovery-spec-files.txt
          count=$(wc -l < recovery-spec-files.txt | tr -d ' ')
          echo "RECOVERED_SPEC_FILE_COUNT=$count"
          test "$count" = "18"

      - name: Upload exact-tree recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-exact-floot-recovery
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package.original.json
            ${{ runner.temp }}/recovered/package.json
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/recovery-package-hashes.txt
            ${{ runner.temp }}/recovered/recovery-environment.txt
            ${{ runner.temp }}/recovered/recovery.vitest.config.mts
            ${{ runner.temp }}/recovered/recovery.vitest.setup.mjs
            ${{ runner.temp }}/recovered/recovery-vitest.log
            ${{ runner.temp }}/recovered/recovery-test-exit.txt
            ${{ runner.temp }}/recovered/recovery-spec-files.txt

      - name: Enforce recovered-suite result
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/recovered
        run: |
          set -euo pipefail
          test -f recovery-test-exit.txt
          exit "$(cat recovery-test-exit.txt)"
