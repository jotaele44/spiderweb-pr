name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    # Docs-only changes don't affect the build (T6-54).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Cancel superseded in-flight runs on the same ref (T6-54).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

jobs:
  # ── Dependency vulnerability scan (advisory, non-gating) ────────────────────
  # pip-audit reports known CVEs in the resolved dependency set (T11-87). Run as
  # continue-on-error so a freshly-published advisory surfaces in the logs
  # without blocking unrelated PRs; promote to gating once the set is clean.
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit (advisory)
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system pip-audit
          uv pip install --system -c constraints.txt -e ".[airspace,earthgpt,server]"
          pip-audit --progress-spinner off || true

  # ── Lint + type check (ruff + black + mypy) on a curated allowlist ──────────
  # CI parity (T6-50): lint + type + test + release-check all gate. The allowlist
  # is intentionally small (gradual per-package typing, T6-49) and grows over
  # time — a repo-wide gate would face ~840 pre-existing ruff findings.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        # Pin via constraints.txt (numpy==2.4.6 etc.) for a reproducible lint
        # environment. Without it, pip floats to numpy>=2.5 whose typeshed stubs
        # use PEP 695 `type` statements that mypy (python_version 3.11) rejects.
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[dev]"

      - name: Lint + type-check (curated allowlist)
        run: |
          LINT_PATHS="provenance_utils.py run_modes.py integration/mbil.py pipeline/db_utils.py pipeline/terrain_hook.py federation/envelope.py federation/readiness.py federation/namespace.py pipeline/logging_config.py pipeline/config_loader.py pipeline/seeding.py pipeline/verbosity.py pipeline/path_safety.py"
          echo "Allowlist: $LINT_PATHS"
          python -m ruff check $LINT_PATHS
          python -m black --check $LINT_PATHS
          python -m mypy $LINT_PATHS

  # ── Spiderweb + LLM pipeline + EarthGPT ─────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches requires-python >=3.11 (the scientific stack needs 3.11+).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (airspace + earthgpt + server extras)
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[airspace,earthgpt,server,dev]" "httpx>=0.27"

      - name: Syntax check all Python modules
        run: find . -path ./.git -prune -o -path ./.claude -prune -o -path ./docs/legacy -prune -o -name "*.py" -print -exec python -m py_compile {} +

      # test_io / test_terrain need the gebco extra (scipy/xarray), which is NOT
      # installed in this job — they run in the dedicated `test-gebco` job below
      # (T5-44). Coverage ratchet (T5-42) enforces a floor on the core packages.
      # Re-baselined 64 -> 62 by the flight-subsystem strip: the removed modules
      # were disproportionately well-covered, so the repo-wide ratio dropped
      # (62.9% observed) without any surviving line losing coverage.
      - name: Run test suite (spiderweb + LLM pipeline + earthgpt)
        run: python -m pytest tests/ -q --tb=short --ignore=tests/test_io.py --ignore=tests/test_terrain.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=62

      - name: EarthGPT self-test (7 gates)
        run: |
          python -c "
          from earthgpt.selftest import run_selftest
          r = run_selftest()
          print(f\"{r['passed']}/{r['total']} gates passed\")
          assert r['passed'] == r['total'], f\"EarthGPT selftest failed: {r}\"
          "

      - name: CLI smoke — status
        run: python run_all.py --db /tmp/ci_smoke.db --status

      - name: CLI smoke — validate (empty DB)
        run: python run_all.py --db /tmp/ci_smoke.db --validate

      - name: CLI smoke — export-pr-intel (empty DB)
        run: |
          python run_all.py --db /tmp/ci_smoke.db --export-pr-intel /tmp/ci_pr_intel
          python -c "
          import json, sys
          r = json.load(open('/tmp/ci_pr_intel/integration_report.json'))
          print('overall_status:', r['overall_status'])
          gates = list(r['gates'])
          assert len(gates) == 6, f'Expected 6 gates, got {gates}'
          print('gates:', gates)
          "

      - name: CLI smoke — export-spiderweb (empty DB)
        run: |
          python run_all.py --db /tmp/ci_smoke.db --export-spiderweb /tmp/ci_spiderweb
          test -f /tmp/ci_spiderweb/spiderweb_ingest_manifest.json
          test -f /tmp/ci_spiderweb/aasb_airspace_edges.csv

      - name: Example-artifact schema gate (T2-18)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          from integration.schema_validation import SchemaValidator

          v = SchemaValidator()

          # Validate checked-in sample export JSONL files against their schema_id
          manifest = json.loads(Path('exports/samples/manifest.sample.json').read_text())
          samples_dir = Path('exports/samples')
          errors = []
          for entry in manifest.get('files', []):
              schema_id = entry.get('schema_id')
              fname = entry.get('filename')
              if not schema_id or not fname:
                  continue
              fpath = samples_dir / fname
              if not fpath.exists():
                  errors.append(f'sample file missing: {fpath}')
                  continue
              for i, line in enumerate(fpath.read_text().splitlines()):
                  line = line.strip()
                  if not line:
                      continue
                  record = json.loads(line)
                  result = v.validate(record, schema_id)
                  if not result['valid']:
                      errors.append(f'{fname}:{i+1} ({schema_id}): {result[\"errors\"]}')
          # Validate federation.json against federation_manifest schema
          fed = json.loads(Path('federation.json').read_text())
          result = v.validate(fed, 'federation_manifest')
          if not result['valid']:
              errors.append(f'federation.json: {result[\"errors\"]}')
          if errors:
              for e in errors:
                  print('FAIL:', e)
              sys.exit(1)
          print(f'Example-artifact gate: all sample records and federation.json valid.')
          "

  # ── Release-gate smoke (X2) — mirrors `make release-check` locally ──────────
  release-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (airspace + earthgpt extras)
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[airspace,earthgpt]"

      - name: Release gate (skip-tests + demo mode, against empty DB)
        # --skip-tests because the `test` job above already ran the full suite;
        # --demo because there's no production DB in CI — strict mode would fail.
        run: |
          python3 release_check.py --db /tmp/release_smoke.db --output-dir /tmp/release_smoke_out --skip-tests --demo
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/release_smoke_out/release_report.json'))
          print('overall_status:', r['overall_status'])
          print('mode:', r['metadata']['mode'])
          # Demo mode should still produce a structurally valid report.
          assert 'syntax_check' in r and 'core_tests' in r, 'release_report missing required stages'
          assert r['metadata']['mode'] == 'demo', f'mode not propagated: {r[\"metadata\"][\"mode\"]}'
          "

  # ── GEBCO bathymetry (synthetic fixtures, no real .nc file needed) ───────────
  test-gebco:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install GEBCO dependencies (gebco extra)
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -c constraints.txt -e ".[gebco,dev]"

      - name: Run GEBCO test suite (39 tests)
        run: python -m pytest tests/test_io.py tests/test_terrain.py -v --tb=short

  # ── Packaging: every extra resolves and its subsystem imports cleanly ────────
  # First real exercise of `pip install .` (packages.find + py-modules + extras).
  # `rag` is omitted — torch is too heavy/slow for CI.
  install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [airspace, gebco, earthgpt, server, federation]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with the ${{ matrix.extra }} extra
        # Deliberately NOT constrained by constraints.txt: this job exists to
        # prove each extra resolves from pyproject.toml on its own. Pinning it
        # would mask exactly the resolution failure it is here to catch.
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[${{ matrix.extra }}]"

      - name: Import smoke for ${{ matrix.extra }}
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python - <<'PY'
          import importlib, os
          extra = os.environ["EXTRA"]
          modules = {
              "airspace": ["pipeline", "integration"],
              "gebco": ["gebco"],
              "earthgpt": ["earthgpt"],
              "server": ["aiosqlite", "fastapi"],
              "federation": ["federation"],
          }[extra]
          for m in modules:
              importlib.import_module(m)
          print(f"{extra}: imported {', '.join(modules)} OK")
          PY

  # Canonical GIS frontend gate: static checks, unit coverage, product-boundary
  # enforcement, production build, and browser acceptance tests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify frontend
        run: npm run verify
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: GIS browser acceptance
        run: npm run test:e2e

  # Reproducible installs: fails when uv.lock no longer satisfies pyproject.toml,
  # so a dependency edit cannot merge without its lockfile update. Mirrors the
  # `lock` job in thehub-pr/.github/workflows/ci.yml.
  #
  # This repo was the last in the federation without a lock-drift gate. It was
  # previously blocked on consolidating the dependency manifests, but that work
  # has since landed — requirements*.txt are now one-line shims deferring to the
  # pyproject extras — so `uv lock` resolves directly.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Lock file is up to date
        run: |
          # PRII_FETCH_HUB: uv.lock resolves ../thehub-pr path sources
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          uv lock --check
