name: Spiderweb recovered endpoint access inventory

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/floot-baseline-2026-09-30
    paths:
      - ".github/workflows/recovery-spiderweb-access-inventory.yml"

permissions:
  contents: read

jobs:
  access-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reconstruct exact recovered tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          ARCHIVE="$RUNNER_TEMP/spiderweb_exact.tar.gz"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          cat .recovery/spiderweb-exact/part-000 .recovery/spiderweb-exact/part-001 .recovery/spiderweb-exact/part-002 .recovery/spiderweb-exact/part-003 > "$ARCHIVE"
          echo "b5e8c8ce51d221819d4f0040bcde5eeb984769cab2fd3165cad7082802723815  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$ROOT"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path(os.environ["RUNNER_TEMP"])/"recovered"
          mf=Path(".recovery/spiderweb-exact/member_manifest.txt")
          exp={}
          for line in mf.read_text().splitlines():
              if not line.strip(): continue
              sha,size,path=line.split("  ",2); exp[path]=(int(size),sha)
          actual=sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file())
          assert set(actual)==set(exp)
          for rel in actual:
              data=(root/rel).read_bytes(); size,sha=exp[rel]
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha, rel
          print("EXACT_MEMBER_VERIFICATION=PASS")
          PY
      - name: Freeze endpoint inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          mkdir -p "$RUNNER_TEMP/access-evidence"
          cp -R "$ROOT/endpoints" "$RUNNER_TEMP/access-evidence/endpoints"
          find "$ROOT/endpoints" -type f -name '*.ts' -print | sort > "$RUNNER_TEMP/access-evidence/endpoint-files.txt"
          sha256sum $(find "$ROOT/endpoints" -type f -name '*.ts' -print | sort) > "$RUNNER_TEMP/access-evidence/endpoint-sha256.txt"
      - name: Upload endpoint access evidence
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-recovered-endpoint-access-inventory
          path: ${{ runner.temp }}/access-evidence
