name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.
# Includes a frontend build step: the UI is the Vite SPA under server/frontend,
# and desktop/pyinstaller.spec refuses to package without server/frontend/dist.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/branding/**"
      - "server/frontend/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      # Node is needed on every OS now, not just Linux: pyinstaller.spec
      # hard-fails without server/frontend/dist, and the Linux-only visual/a11y
      # harness below also needs it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      # Build the UI before packaging. Doing it here — rather than in
      # desktop/setup.py on the user's machine — is what keeps the zero-Terminal
      # contract: the frozen bundle carries dist/, so end users need no Node.
      # The blank VITE_API_BASE keeps the bundle same-origin against whichever
      # ephemeral port the wrapper binds (mirrors desktop/config.py).
      - name: Build frontend
        shell: bash
        working-directory: server/frontend
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python dependencies
        shell: bash
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system --upgrade pip
          uv pip install --system -c constraints.txt -r requirements-desktop.txt -r ../thehub-pr/tools/requirements-icons.txt -e ".[server]" pyinstaller pytest httpx

      # The branding validator ships with thehub-pr. It is invoked by whichever
      # name that repo actually provides, and skipped with a notice when neither
      # is present: this workflow resolves thehub-pr by matching branch name and
      # falls back to its main, where the validator does not exist yet — so a
      # hard call fails every branch that isn't the one introducing it. The icon
      # check and the shared runtime's own tests exist on main and always run.
      - name: Verify supplied artwork, AA palette, and fresh-machine setup
        shell: bash
        run: |
          python ../thehub-pr/tools/build_program_icons.py --repo . --check
          validator=""
          for candidate in verify_desktop_branding validate_desktop_branding; do
            if [ -f "../thehub-pr/tools/$candidate.py" ]; then
              validator="../thehub-pr/tools/$candidate.py"
              break
            fi
          done
          if [ -n "$validator" ]; then
            python "$validator" --repo .
          else
            echo "::notice::thehub-pr provides no desktop-branding validator; skipping."
          fi
          python -m pytest ../thehub-pr/packages/prii_desktop/tests -q

      # Same conditional reasoning as the branding validator above: the renderer
      # and the Playwright harness live in thehub-pr, which resolves to main on
      # most branches and does not carry them yet.
      - name: Visual and accessibility smoke for native setup
        if: runner.os == 'Linux'
        shell: bash
        env:
          PRII_REPO_SLUG: spiderweb-pr
          PRII_SETUP_FIXTURE: ${{ github.workspace }}/desktop-ui-artifacts/setup.html
          PRII_VISUAL_DIR: ${{ github.workspace }}/desktop-ui-artifacts
        run: |
          renderer="../thehub-pr/tools/render_desktop_setup.py"
          harness="../thehub-pr/federation-design/test-harness"
          if [ ! -f "$renderer" ] || [ ! -d "$harness" ]; then
            echo "::notice::thehub-pr provides no desktop-setup renderer/harness; skipping."
            exit 0
          fi
          python "$renderer" --repo . --output desktop-ui-artifacts/setup.html
          cd "$harness"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/desktop-setup.spec.js \
            --project=tablet-768 --project=desktop-1280

      - name: Upload native setup visual evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiderweb-pr-native-setup-visuals
          path: desktop-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-SPIDERWEB"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-SPIDERWEB.app" ]; then
            zip -qry "PRII-SPIDERWEB-${RUNNER_OS}.zip" "PRII-SPIDERWEB.app"
          else
            7z a -bd "PRII-SPIDERWEB-${RUNNER_OS}.zip" "PRII-SPIDERWEB" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-SPIDERWEB.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-SPIDERWEB" -srcfolder "$staging" \
            -ov -format UDZO "PRII-SPIDERWEB-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRII-SPIDERWEB-${{ runner.os }}
          path: |
            dist-desktop/PRII-SPIDERWEB-*.zip
            dist-desktop/PRII-SPIDERWEB-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-desktop/PRII-SPIDERWEB-*.zip
            dist-desktop/PRII-SPIDERWEB-*.dmg
