name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.
# Includes a frontend build step because desktop/pyinstaller.spec packages the
# Vite SPA under server/frontend/dist.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/branding/**"
      - "server/frontend/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PRII_TOOLING_REF: f2b81769924689b4d959554928810b1d7b7ef3d6
      PRII_FORBIDDEN_SIBLING: thehub-pr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce isolated desktop-build policy
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          python - <<'PY'
          from pathlib import Path
          needles = (
              "../" + "thehub-pr",
              "ensure_" + "hub_sibling",
              "HUB_" + "CLONE_URL",
              "HUB_" + "SIBLING",
              "REPO_ROOT.parent / " + '"thehub-pr"',
          )
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith((".git/", ".venv/", "node_modules/", "dist/", "build/")):
                  continue
              executable = rel == ".github/workflows/desktop-build.yml"
              executable = executable or rel.startswith(("desktop/", "scripts/", "tools/"))
              executable = executable or path.name.startswith("requirements")
              executable = executable or path.name in {"pyproject.toml", "Makefile"}
              if not executable:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for needle in needles:
                  if needle in text:
                      violations.append(f"{rel}: {needle}")
          if violations:
              raise SystemExit("mandatory sibling coupling found:\n" + "\n".join(violations))
          PY

      - name: Fetch pinned federation tooling outside workspace
        shell: bash
        run: |
          tooling_root="$RUNNER_TEMP/prii-thehub-tooling"
          rm -rf "$tooling_root"
          git clone --filter=blob:none --no-checkout https://github.com/jotaele44/thehub-pr.git "$tooling_root"
          git -C "$tooling_root" checkout --detach "$PRII_TOOLING_REF"
          test "$(git -C "$tooling_root" rev-parse HEAD)" = "$PRII_TOOLING_REF"
          echo "PRII_TOOLING_ROOT=$tooling_root" >> "$GITHUB_ENV"
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Build frontend
        shell: bash
        working-directory: server/frontend
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python dependencies
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system --upgrade pip
          uv pip install --system -c constraints.txt -r requirements-desktop.txt -r "$PRII_TOOLING_ROOT/tools/requirements-icons.txt" -e ".[server]" pyinstaller pytest httpx
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - name: Verify supplied artwork, AA palette, and fresh-machine setup
        shell: bash
        run: |
          python "$PRII_TOOLING_ROOT/tools/build_program_icons.py" --repo . --check
          python "$PRII_TOOLING_ROOT/tools/validate_desktop_branding.py" --repo .
          python -m pytest "$PRII_TOOLING_ROOT/packages/prii_desktop/tests" -q

      - name: Visual and accessibility smoke for native setup
        if: runner.os == 'Linux'
        shell: bash
        env:
          PRII_REPO_SLUG: spiderweb-pr
          PRII_SETUP_FIXTURE: ${{ github.workspace }}/desktop-ui-artifacts/setup.html
          PRII_VISUAL_DIR: ${{ github.workspace }}/desktop-ui-artifacts
        run: |
          python "$PRII_TOOLING_ROOT/tools/render_desktop_setup.py" \
            --repo . --output desktop-ui-artifacts/setup.html
          cd "$PRII_TOOLING_ROOT/federation-design/test-harness"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/desktop-setup.spec.js \
            --project=tablet-768 --project=desktop-1280

      - name: Upload native setup visual evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spiderweb-pr-native-setup-visuals
          path: desktop-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-SPIDERWEB"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-SPIDERWEB.app" ]; then
            zip -qry "PRII-SPIDERWEB-${RUNNER_OS}.zip" "PRII-SPIDERWEB.app"
          else
            7z a -bd "PRII-SPIDERWEB-${RUNNER_OS}.zip" "PRII-SPIDERWEB" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-SPIDERWEB.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-SPIDERWEB" -srcfolder "$staging" \
            -ov -format UDZO "PRII-SPIDERWEB-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRII-SPIDERWEB-${{ runner.os }}
          path: |
            dist-desktop/PRII-SPIDERWEB-*.zip
            dist-desktop/PRII-SPIDERWEB-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist-desktop/PRII-SPIDERWEB-*.zip
            dist-desktop/PRII-SPIDERWEB-*.dmg
