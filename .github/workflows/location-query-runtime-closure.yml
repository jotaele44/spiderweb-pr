name: LOCATION_QUERY Runtime Closure

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Immutable runtime snapshot ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LOCATION_QUERY runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[geo,dev]"

      - name: Verify runtime closure shell syntax
        run: bash -n scripts/run_location_query_runtime_closure.sh

      - name: Run immutable runtime closure
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          scripts/run_location_query_runtime_closure.sh "$RUN_ID"

      - name: Freeze snapshot hashes
        if: always()
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          SNAPSHOT="outputs/location_query/runtime_closure/$RUN_ID"
          if [[ -d "$SNAPSHOT" ]]; then
            find "$SNAPSHOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$SNAPSHOT/ARTIFACT_SHA256SUMS.txt"
          fi

      - name: Upload runtime closure snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-query-runtime-closure-${{ inputs.run_id }}
          path: outputs/location_query/runtime_closure/${{ inputs.run_id }}
          if-no-files-found: error
          retention-days: 30
