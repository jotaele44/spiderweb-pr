name: EX1811 W00247 overlap v0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire EX1811 XYZ and compute W00247 overlap
        run: |
          set -euo pipefail
          mkdir -p evidence/marine/ex1811_xyz_w00247_v0_1
          PYTHONPATH=. python scripts/run_ex1811_xyz_intersection.py > evidence/marine/ex1811_xyz_w00247_v0_1.stdout.json
      - name: Freeze overlap ledger
        run: |
          set -euo pipefail
          cd evidence/marine
          find ex1811_xyz_w00247_v0_1 -type f -print0 | sort -z | xargs -0 sha256sum > ex1811_xyz_w00247_v0_1.sha256
          sha256sum ex1811_xyz_w00247_v0_1.stdout.json >> ex1811_xyz_w00247_v0_1.sha256
      - name: Upload overlap evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ex1811-w00247-overlap-v0-1
          path: |
            evidence/marine/ex1811_xyz_w00247_v0_1/
            evidence/marine/ex1811_xyz_w00247_v0_1.stdout.json
            evidence/marine/ex1811_xyz_w00247_v0_1.sha256
          if-no-files-found: error
          retention-days: 30
