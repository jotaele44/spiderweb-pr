name: Reconcile isolation lock

on:
  push:
    branches:
      - codex/remove-mandatory-sibling-coupling-v0-1
    paths:
      - ".github/workflows/reconcile-isolation-lock.yml"

permissions:
  contents: write

concurrency:
  group: reconcile-isolation-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Regenerate lock from reconciled project metadata
        run: uv lock
      - name: Commit lock only if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: regenerate isolation lock after main reconciliation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
