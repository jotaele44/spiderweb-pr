name: Spiderweb recovery successor v4 — canonical analysis graph
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/spiderweb-successor-v4/**"
      - ".github/workflows/recovery-spiderweb-successor-v4.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install recovered-tree npx compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo "REAL_NPX=$(command -v npx)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/recovery-bin"
          cp .recovery/spiderweb-exact/npx-v5-wrapper.sh "$RUNNER_TEMP/recovery-bin/npx"
          chmod +x "$RUNNER_TEMP/recovery-bin/npx"
          echo "$RUNNER_TEMP/recovery-bin" >> "$GITHUB_PATH"
      - name: Reproduce exact baseline
        shell: bash
        run: bash .recovery/spiderweb-exact/run_v3.sh
      - name: Apply successor overlays v1-v4
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          echo "ad60cb8662067a28a21c33709024314ebd03970285b5ed24fd22082114204630  .recovery/spiderweb-successor-v1/overlay.tar.gz" | sha256sum -c -
          echo "a933bdc3ed5ab9ffbede02f62e93816a4821a81c6eb677af37edb1619571caaa  .recovery/spiderweb-successor-v2/overlay.tar.gz" | sha256sum -c -
          echo "8a893730c4b517b869c24499d8b02f684d0e843d486bc3a7bbc34938b4f20183  .recovery/spiderweb-successor-v3/overlay.tar.gz" | sha256sum -c -
          echo "227b50d477c209ee19a0bb1484fc92db3acef23c1fca785f1a2008c558d6f15e  .recovery/spiderweb-successor-v4/overlay.tar.gz" | sha256sum -c -
          for version in v1 v2 v3 v4; do tar -xzf ".recovery/spiderweb-successor-${version}/overlay.tar.gz" -C "$ROOT"; done
          cd "$ROOT"
          echo "fb70b6a905f74edaf6d10a9d9b68f1aad869772a152fcfafffd2176bc530ccba  helpers/spatialAnalysisGraph.tsx" | sha256sum -c -
          echo "7aeedca589fe37bbd4cfc1808b36a39797b61c891ea0556a58257cf4cfac22bf  helpers/spatialAnalysisGraph.spec.tsx" | sha256sum -c -
          sha256sum helpers/spatialAnalysisGraph.tsx helpers/spatialAnalysisGraph.spec.tsx > successor-v4-overlay-hashes.txt
      - name: Execute successor v4 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose 2>&1 | tee successor-v4-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v4-test-exit.txt
          test "$status" = "0"
          grep -q "spatialAnalysisGraph.spec.tsx" successor-v4-vitest.log
          grep -q "22 passed" successor-v4-vitest.log
          grep -q "133 passed" successor-v4-vitest.log
      - name: Freeze successor v4 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=spiderweb-recovery-successor/v4"
            echo "baseline_tests=75"
            echo "successor_v1_tests=90"
            echo "successor_v2_tests=108"
            echo "successor_v3_tests=125"
            echo "successor_v4_tests=133"
            echo "analysis_execution=ONE_CANONICAL_GRAPH"
            echo "state=PASS"
          } > successor-v4-receipt.txt
          sha256sum package-lock.json successor-v4-overlay-hashes.txt successor-v4-vitest.log successor-v4-receipt.txt > successor-v4-evidence-hashes.txt
      - name: Upload successor v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-recovery-successor-v4
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v4-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v4-vitest.log
            ${{ runner.temp }}/recovered/successor-v4-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v4-receipt.txt
            ${{ runner.temp }}/recovered/successor-v4-evidence-hashes.txt
