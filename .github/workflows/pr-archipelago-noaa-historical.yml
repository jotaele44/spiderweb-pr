name: PR Archipelago NOAA Historical Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/acquire_pr_archipelago_noaa_historical.py"
      - ".github/workflows/pr-archipelago-noaa-historical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaa-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze NOAA historical Puerto Rico shoreline manifestations
        run: |
          python scripts/acquire_pr_archipelago_noaa_historical.py \
            --output evidence/pr_archipelago/historical_snapshots/noaa_shoreline
      - name: Inventory historical NOAA evidence
        if: always()
        run: |
          find evidence/pr_archipelago/historical_snapshots/noaa_shoreline -type f -printf '%p %s bytes\n' | sort || true
          sha256sum evidence/pr_archipelago/historical_snapshots/noaa_shoreline/noaa_historical_shoreline_manifest.json || true
      - name: Upload historical NOAA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-archipelago-noaa-historical
          path: evidence/pr_archipelago/historical_snapshots/noaa_shoreline/
          if-no-files-found: error
          retention-days: 30
