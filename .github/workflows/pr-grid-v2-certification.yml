name: PR grid V2 certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spiderweb/geographic_grid_v2.py"
      - "spiderweb/grid_v2_bindings.py"
      - "spiderweb/grid_v2_source_coordinates.py"
      - "spiderweb/grid_v2_geometry_bindings.py"
      - "spiderweb/grid_v2_record_migration.py"
      - "scripts/generate_pr_grid_geographic_v2.py"
      - "scripts/materialize_pr_grid_v2_exact_point_bindings.py"
      - "scripts/materialize_pr_grid_v2_source_coordinate_bindings.py"
      - "scripts/materialize_pr_grid_v2_geometry_bindings.py"
      - "scripts/materialize_pr_grid_v2_set_bindings.py"
      - "scripts/materialize_pr_grid_v2_record_bindings.py"
      - "tests/test_geographic_grid_v2.py"
      - "tests/test_grid_v2_bindings.py"
      - "tests/test_grid_v2_source_coordinates.py"
      - "tests/test_grid_v2_geometry_bindings.py"
      - "tests/test_grid_v2_set_bindings.py"
      - "tests/test_grid_v2_record_migration.py"
      - "requirements-grid-v2.txt"
      - "schemas/pr_grid_geographic_v2_*.schema.json"
      - "registry/spatial/v2/**"
      - ".github/workflows/pr-grid-v2-certification.yml"
  push:
    branches: [main]
    paths:
      - "spiderweb/geographic_grid_v2.py"
      - "spiderweb/grid_v2_bindings.py"
      - "spiderweb/grid_v2_source_coordinates.py"
      - "spiderweb/grid_v2_geometry_bindings.py"
      - "spiderweb/grid_v2_record_migration.py"
      - "scripts/generate_pr_grid_geographic_v2.py"
      - "scripts/materialize_pr_grid_v2_exact_point_bindings.py"
      - "scripts/materialize_pr_grid_v2_source_coordinate_bindings.py"
      - "scripts/materialize_pr_grid_v2_geometry_bindings.py"
      - "scripts/materialize_pr_grid_v2_set_bindings.py"
      - "scripts/materialize_pr_grid_v2_record_bindings.py"
      - "tests/test_geographic_grid_v2.py"
      - "tests/test_grid_v2_bindings.py"
      - "tests/test_grid_v2_source_coordinates.py"
      - "tests/test_grid_v2_geometry_bindings.py"
      - "tests/test_grid_v2_set_bindings.py"
      - "tests/test_grid_v2_record_migration.py"
      - "requirements-grid-v2.txt"
      - "schemas/pr_grid_geographic_v2_*.schema.json"
      - "registry/spatial/v2/**"
      - ".github/workflows/pr-grid-v2-certification.yml"

permissions:
  contents: read

jobs:
  certify-pr-grid-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema -r requirements-grid-v2.txt

      - name: Run native V2 certification tests
        run: python -m pytest -q tests/test_geographic_grid_v2.py tests/test_grid_v2_bindings.py tests/test_grid_v2_source_coordinates.py tests/test_grid_v2_geometry_bindings.py tests/test_grid_v2_set_bindings.py tests/test_grid_v2_record_migration.py

      - name: Smoke source-coordinate migration
        run: |
          cat > /tmp/pr_grid_v2_source_points.jsonl <<'JSONL'
          {"Repository":"aguayluz-pr","Record_ID":"wgs84","Source_X":-66.0,"Source_Y":18.35,"Source_CRS":"EPSG:4326","Coordinate_Evidence_State":"VERIFIED_SOURCE_COORDINATE","Uncertainty_Class":"EXACT"}
          {"Repository":"aguayluz-pr","Record_ID":"edge","Source_X":247000.0000005,"Source_Y":255500,"Source_CRS":"EPSG:6566","Coordinate_Evidence_State":"VERIFIED_SOURCE_COORDINATE","Uncertainty_Class":"EXACT"}
          JSONL
          python scripts/materialize_pr_grid_v2_source_coordinate_bindings.py \
            --input /tmp/pr_grid_v2_source_points.jsonl \
            --level L1 \
            --bindings-out /tmp/pr_grid_v2_source_bindings.jsonl \
            --projection-out /tmp/pr_grid_v2_source_projection.jsonl \
            --receipt-out /tmp/pr_grid_v2_source_receipt.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bindings = Path("/tmp/pr_grid_v2_source_bindings.jsonl")
          projection = Path("/tmp/pr_grid_v2_source_projection.jsonl")
          receipt = json.loads(Path("/tmp/pr_grid_v2_source_receipt.json").read_text())
          assert receipt["Migration_Provenance_Class"] == "RECOMPUTED_FROM_SOURCE_COORDINATE"
          assert receipt["Input_Record_Count"] == 2
          assert receipt["Binding_Row_Count"] == 3
          assert receipt["Projection_Audit_Row_Count"] == 2
          assert receipt["State_Counts"] == {"EDGE_SHARED": 1, "INTERIOR": 1}
          assert receipt["Binding_Output_SHA256"] == hashlib.sha256(bindings.read_bytes()).hexdigest()
          assert receipt["Projection_Output_SHA256"] == hashlib.sha256(projection.read_bytes()).hexdigest()
          assert receipt["Receipt_State"] == "PASS"
          print("SOURCE_COORDINATE_MIGRATION=PASS")
          PY

      - name: Smoke exact geometry migration
        run: |
          cat > /tmp/pr_grid_v2_geometries.jsonl <<'JSONL'
          {"Repository":"aguayluz-pr","Record_ID":"poly","CRS":"EPSG:6566","Spatial_Role":"FACILITY_FOOTPRINT","Uncertainty_Class":"EXACT","Geometry":{"type":"Polygon","coordinates":[[[246500,255250],[247500,255250],[247500,255750],[246500,255750],[246500,255250]]]}}
          {"Repository":"skywatcher-pr","Record_ID":"line","CRS":"EPSG:6566","Spatial_Role":"TRACK_SEGMENT","Uncertainty_Class":"EXACT","Geometry":{"type":"LineString","coordinates":[[246100,255500],[247900,255500]]}}
          JSONL
          python scripts/materialize_pr_grid_v2_geometry_bindings.py \
            --input /tmp/pr_grid_v2_geometries.jsonl \
            --level L1 \
            --bindings-out /tmp/pr_grid_v2_geometry_bindings.jsonl \
            --receipt-out /tmp/pr_grid_v2_geometry_receipt.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bindings = Path("/tmp/pr_grid_v2_geometry_bindings.jsonl")
          rows = [json.loads(x) for x in bindings.read_text().splitlines() if x]
          receipt = json.loads(Path("/tmp/pr_grid_v2_geometry_receipt.json").read_text())
          assert receipt["Migration_Provenance_Class"] == "RECOMPUTED_FROM_SOURCE_GEOMETRY"
          assert receipt["Input_Record_Count"] == 2
          assert receipt["Binding_Row_Count"] == 4
          assert receipt["Binding_Method_Counts"] == {
              "INTERSECTS_POSITIVE_AREA": 2,
              "LINE_POSITIVE_LENGTH": 2,
          }
          assert receipt["Binding_Output_SHA256"] == hashlib.sha256(bindings.read_bytes()).hexdigest()
          assert receipt["Receipt_State"] == "PASS"
          assert sum(r["Overlap_Area_m2"] or 0 for r in rows) == 500000.0
          assert sum(r["Length_In_Cell_m"] or 0 for r in rows) == 1800.0
          print("SOURCE_GEOMETRY_MIGRATION=PASS")
          PY

      - name: Smoke administrative and derived set migration
        run: |
          cat > /tmp/pr_grid_v2_sets.jsonl <<'JSONL'
          {"Repository":"ovnis-pr","Record_ID":"admin","CRS":"EPSG:6566","Spatial_Role":"REPORTED_MUNICIPALITY_EXTENT","Binding_Method":"ADMINISTRATIVE_SET","Uncertainty_Class":"ADMINISTRATIVE_ONLY","Geometry_Evidence_State":"VERIFIED_ADMINISTRATIVE_GEOMETRY","Geometry":{"type":"Polygon","coordinates":[[[246500,255250],[247500,255250],[247500,255750],[246500,255750],[246500,255250]]]}}
          {"Repository":"moneysweep-pr","Record_ID":"derived","CRS":"EPSG:6566","Spatial_Role":"DERIVED_ANALYSIS_EXTENT","Binding_Method":"DERIVED_SET","Uncertainty_Class":"DERIVED","Geometry_Evidence_State":"VERIFIED_DERIVED_GEOMETRY","Geometry":{"type":"Polygon","coordinates":[[[246500,255250],[247500,255250],[247500,255750],[246500,255750],[246500,255250]]]}}
          JSONL
          python scripts/materialize_pr_grid_v2_set_bindings.py \
            --input /tmp/pr_grid_v2_sets.jsonl \
            --level L1 \
            --bindings-out /tmp/pr_grid_v2_set_bindings.jsonl \
            --receipt-out /tmp/pr_grid_v2_set_receipt.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bindings = Path("/tmp/pr_grid_v2_set_bindings.jsonl")
          rows = [json.loads(x) for x in bindings.read_text().splitlines() if x]
          receipt = json.loads(Path("/tmp/pr_grid_v2_set_receipt.json").read_text())
          assert receipt["Input_Record_Count"] == 2
          assert receipt["Binding_Row_Count"] == 4
          assert receipt["Exact_Cell_Claim_Permitted"] is False
          assert receipt["Binding_Method_Record_Counts"] == {
              "ADMINISTRATIVE_SET": 1,
              "DERIVED_SET": 1,
          }
          assert {r["Uncertainty_Class"] for r in rows} == {
              "ADMINISTRATIVE_ONLY",
              "DERIVED",
          }
          assert all(r["Confidence"] is None for r in rows)
          assert receipt["Binding_Output_SHA256"] == hashlib.sha256(bindings.read_bytes()).hexdigest()
          assert receipt["Receipt_State"] == "PASS"
          print("SET_BINDING_MIGRATION=PASS")
          PY

      - name: Smoke canonical mixed record migration dispatcher
        run: |
          cat > /tmp/pr_grid_v2_mixed_migration.jsonl <<'JSONL'
          {"Migration_Input_Class":"EXACT_PROJECTED_POINT","Repository":"aguayluz-pr","Record_ID":"point","X":246500,"Y":255500,"CRS":"EPSG:6566","Uncertainty_Class":"EXACT"}
          {"Migration_Input_Class":"EXACT_SOURCE_POINT","Repository":"ovnis-pr","Record_ID":"edge","Source_X":247000,"Source_Y":255500,"Source_CRS":"EPSG:6566","Coordinate_Evidence_State":"VERIFIED_SOURCE_COORDINATE","Uncertainty_Class":"EXACT"}
          {"Migration_Input_Class":"EXACT_PROJECTED_GEOMETRY","Repository":"skywatcher-pr","Record_ID":"line","CRS":"EPSG:6566","Spatial_Role":"TRACK_SEGMENT","Uncertainty_Class":"EXACT","Geometry":{"type":"LineString","coordinates":[[246100,255500],[247900,255500]]}}
          {"Migration_Input_Class":"ADMINISTRATIVE_SET","Repository":"ovnis-pr","Record_ID":"admin","CRS":"EPSG:6566","Binding_Method":"ADMINISTRATIVE_SET","Uncertainty_Class":"ADMINISTRATIVE_ONLY","Geometry_Evidence_State":"VERIFIED_ADMINISTRATIVE_GEOMETRY","Geometry":{"type":"Polygon","coordinates":[[[246500,255250],[247500,255250],[247500,255750],[246500,255750],[246500,255250]]]}}
          {"Migration_Input_Class":"DERIVED_SET","Repository":"moneysweep-pr","Record_ID":"derived","CRS":"EPSG:6566","Binding_Method":"DERIVED_SET","Uncertainty_Class":"DERIVED","Geometry_Evidence_State":"VERIFIED_DERIVED_GEOMETRY","Geometry":{"type":"Polygon","coordinates":[[[246500,255250],[247500,255250],[247500,255750],[246500,255750],[246500,255250]]]}}
          JSONL
          python scripts/materialize_pr_grid_v2_record_bindings.py \
            --input /tmp/pr_grid_v2_mixed_migration.jsonl \
            --level L1 \
            --bindings-out /tmp/pr_grid_v2_mixed_bindings.jsonl \
            --audit-out /tmp/pr_grid_v2_mixed_audit.jsonl \
            --receipt-out /tmp/pr_grid_v2_mixed_receipt.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bindings = Path("/tmp/pr_grid_v2_mixed_bindings.jsonl")
          audit = Path("/tmp/pr_grid_v2_mixed_audit.jsonl")
          receipt = json.loads(Path("/tmp/pr_grid_v2_mixed_receipt.json").read_text())
          assert receipt["contract"] == "pr-grid-v2-record-migration/1.0"
          assert receipt["Input_Record_Count"] == 5
          assert receipt["Unique_Record_Identity_Count"] == 5
          assert receipt["Binding_Row_Count"] == 9
          assert receipt["Projection_Audit_Row_Count"] == 1
          assert receipt["Exact_Record_Count"] == 3
          assert receipt["Non_Exact_Set_Record_Count"] == 2
          assert receipt["Binding_Output_SHA256"] == hashlib.sha256(bindings.read_bytes()).hexdigest()
          assert receipt["Audit_Output_SHA256"] == hashlib.sha256(audit.read_bytes()).hexdigest()
          assert receipt["Receipt_State"] == "PASS"
          assert receipt["Promotion_State"] == "CANDIDATE_NOT_CANONICAL"
          assert receipt["Geometry_Copied"] is False
          print("CANONICAL_RECORD_MIGRATION_DISPATCHER=PASS")
          PY

      - name: Materialize complete L0-L3 indexes
        run: |
          python scripts/generate_pr_grid_geographic_v2.py \
            --output-dir artifacts/pr-grid-v2/indexes \
            --manifest artifacts/pr-grid-v2/pr_grid_geographic_v2.manifest.json

      - name: Assert materialized row denominators
        run: |
          test "$(($(wc -l < artifacts/pr-grid-v2/indexes/pr_grid_geographic_v2_l0.csv) - 1))" -eq 11457
          test "$(($(wc -l < artifacts/pr-grid-v2/indexes/pr_grid_geographic_v2_l1.csv) - 1))" -eq 45828
          test "$(($(wc -l < artifacts/pr-grid-v2/indexes/pr_grid_geographic_v2_l2.csv) - 1))" -eq 183312
          test "$(($(wc -l < artifacts/pr-grid-v2/indexes/pr_grid_geographic_v2_l3.csv) - 1))" -eq 733248
          sha256sum artifacts/pr-grid-v2/indexes/*.csv | sort > artifacts/pr-grid-v2/INDEX_SHA256SUMS.txt
          wc -l artifacts/pr-grid-v2/indexes/*.csv > artifacts/pr-grid-v2/INDEX_LINE_COUNTS.txt

      - name: Verify frozen materialization receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("registry/spatial/v2/pr_grid_geographic_v2.materialization.json").read_text()
          )
          contract_manifest = json.loads(
              Path("registry/spatial/v2/pr_grid_geographic_v2.manifest.json").read_text()
          )
          generated_manifest = json.loads(
              Path("artifacts/pr-grid-v2/pr_grid_geographic_v2.manifest.json").read_text()
          )

          assert contract_manifest["Grid_Manifest_SHA256"] == receipt["Grid_Manifest_SHA256"]
          assert (
              generated_manifest["Grid_Manifest_SHA256"]
              == receipt["Materialized_Manifest_SHA256"]
          )

          total = 0
          for level, expected in receipt["Levels"].items():
              path = Path(
                  f"artifacts/pr-grid-v2/indexes/pr_grid_geographic_v2_{level.lower()}.csv"
              )
              payload = path.read_bytes()
              rows = payload.count(b"\n") - 1
              digest = hashlib.sha256(payload).hexdigest()
              assert rows == expected["rows"], (level, rows, expected["rows"])
              assert len(payload) == expected["bytes"], (
                  level,
                  len(payload),
                  expected["bytes"],
              )
              assert digest == expected["sha256"], (
                  level,
                  digest,
                  expected["sha256"],
              )
              total += rows

          assert total == receipt["Cell_Total"]
          print("FROZEN_MATERIALIZATION_RECEIPT=PASS")
          PY

      - name: Upload complete V2 certification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-grid-geographic-v2-rc1
          path: artifacts/pr-grid-v2/
          retention-days: 90


  certify-aguayluz-nwps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGUAYLUZ_NWPS_COMMIT: 459c0777365786419da5c62db20abfdec21aa092
      AGUAYLUZ_NWPS_BLOB_SHA1: e79f4526c8f6128f6e312ce3592f5518332ecd2f
      GRID_LEVEL: L1
    steps:
      - name: Check out Spiderweb authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out frozen AguaYLuz source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jotaele44/aguayluz-pr
          ref: ${{ env.AGUAYLUZ_NWPS_COMMIT }}
          path: _source/aguayluz-pr

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify frozen source identity
        run: |
          test "$(git -C _source/aguayluz-pr rev-parse HEAD)" = "$AGUAYLUZ_NWPS_COMMIT"
          test "$(git -C _source/aguayluz-pr hash-object data/nwps_gauge_state.jsonl)" = "$AGUAYLUZ_NWPS_BLOB_SHA1"

      - name: Install grid migration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-grid-v2.txt

      - name: Export exact NWPS source-coordinate denominator
        run: |
          mkdir -p artifacts/aguayluz-nwps-v2
          python _source/aguayluz-pr/scripts/export_nwps_grid_v2_source_records.py \
            --source _source/aguayluz-pr/data/nwps_gauge_state.jsonl \
            --binding-out artifacts/aguayluz-nwps-v2/binding_input.jsonl \
            --records-out artifacts/aguayluz-nwps-v2/profile_records.jsonl \
            --receipt-out artifacts/aguayluz-nwps-v2/export_receipt.json

      - name: Materialize Spiderweb-authoritative V2 bindings
        run: |
          python scripts/materialize_pr_grid_v2_source_coordinate_bindings.py \
            --input artifacts/aguayluz-nwps-v2/binding_input.jsonl \
            --level "$GRID_LEVEL" \
            --bindings-out artifacts/aguayluz-nwps-v2/bindings.jsonl \
            --projection-out artifacts/aguayluz-nwps-v2/projection_audit.jsonl \
            --receipt-out artifacts/aguayluz-nwps-v2/binding_receipt.json

      - name: Materialize AguaYLuz domain Cell Profiles
        run: |
          python _source/aguayluz-pr/federation/spatial/materialize_pr_grid_v2_profiles.py \
            --pin _source/aguayluz-pr/federation/spatial/pr_grid_geographic_v2.pin.json \
            --records artifacts/aguayluz-nwps-v2/profile_records.jsonl \
            --bindings artifacts/aguayluz-nwps-v2/bindings.jsonl \
            --binding-receipt artifacts/aguayluz-nwps-v2/binding_receipt.json \
            --level "$GRID_LEVEL" \
            --out artifacts/aguayluz-nwps-v2/profiles.jsonl \
            --receipt-out artifacts/aguayluz-nwps-v2/profile_receipt.json

      - name: Certify frozen migration artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/aguayluz-nwps-v2")
          source = Path("_source/aguayluz-pr/data/nwps_gauge_state.jsonl")
          export = json.loads((root / "export_receipt.json").read_text())
          binding = json.loads((root / "binding_receipt.json").read_text())
          profile = json.loads((root / "profile_receipt.json").read_text())

          count = export["Input_Record_Count"]
          assert count > 0
          assert export["Unique_Record_ID_Count"] == count
          assert export["Binding_Input_Record_Count"] == count
          assert export["Profile_Record_Count"] == count
          assert binding["Input_Record_Count"] == count
          assert binding["Projection_Audit_Row_Count"] == count
          assert binding["Migration_Provenance_Class"] == "RECOMPUTED_FROM_SOURCE_COORDINATE"
          assert binding["Coordinate_Evidence_State"] == "VERIFIED_SOURCE_COORDINATE"
          assert binding["Source_CRS_Counts"] == {"EPSG:4326": count}
          assert binding["Receipt_State"] == "PASS"
          assert profile["Migration_Class"] == "RECOMPUTED_FROM_SOURCE_COORDINATE"
          assert profile["Geometry_Copied"] is False
          assert profile["State"] == "CANDIDATE_NOT_CANONICAL"

          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  payload = path.read_bytes()
                  files[path.name] = {
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }

          cert = {
              "Contract": "aguayluz-nwps-pr-grid-v2-certification/1.0",
              "Repository": "aguayluz-pr",
              "Source_Commit": os.environ["AGUAYLUZ_NWPS_COMMIT"],
              "Source_Git_Blob_SHA1": os.environ["AGUAYLUZ_NWPS_BLOB_SHA1"],
              "Source_SHA256": hashlib.sha256(source.read_bytes()).hexdigest(),
              "Grid_Level": os.environ["GRID_LEVEL"],
              "Input_Record_Count": count,
              "Binding_Row_Count": binding["Binding_Row_Count"],
              "State_Counts": binding["State_Counts"],
              "Profile_Count": profile["Profile_Count"],
              "Artifacts": files,
              "Geometry_Copied": False,
              "State": "PASS",
          }
          (root / "certification.json").write_text(
              json.dumps(cert, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(cert, indent=2, sort_keys=True))
          PY

      - name: Upload frozen NWPS V2 migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aguayluz-nwps-pr-grid-v2-L1
          path: artifacts/aguayluz-nwps-v2/
          retention-days: 90
