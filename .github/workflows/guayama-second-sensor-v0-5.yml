name: Guayama second sensor v0.5

on:
  push:
    branches:
      - feat/guayama-second-sensor-v0-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footprint-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact NCEI multibeam footprint intersection
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_multibeam_footprint_intersection.py > evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json
      - name: Freeze footprint ledger
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/marine
          find evidence/marine/w00247_multibeam_footprints_v0_1 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > evidence/marine/guayama_second_sensor_v0_5.sha256
          if [ -f evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json ]; then
            sha256sum evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json >> evidence/marine/guayama_second_sensor_v0_5.sha256
          fi
      - name: Upload bounded footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guayama-second-sensor-v0-5
          path: |
            evidence/marine/w00247_multibeam_footprints_v0_1/
            evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json
            evidence/marine/guayama_second_sensor_v0_5.sha256
          if-no-files-found: warn
          retention-days: 30
