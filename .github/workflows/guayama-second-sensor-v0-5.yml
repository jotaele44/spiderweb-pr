name: Guayama second sensor v0.5

on:
  push:
    branches:
      - feat/guayama-second-sensor-v0-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footprint-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster reader
        run: python -m pip install --disable-pip-version-check rasterio
      - name: Execute exact NCEI multibeam footprint intersection
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_multibeam_footprint_intersection.py > evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json
      - name: Inventory direct products for intersecting roots
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_intersecting_multibeam_product_inventory.py > evidence/marine/w00247_multibeam_product_inventory_v0_1.stdout.json
      - name: Acquire EX1502L3 and clip to valid W00247 BAG cells
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_ex1502l3_w00247_valid_overlap.py > evidence/marine/ex1502l3_w00247_overlap_v0_1.stdout.json
      - name: Adjudicate EX1502L3 vertical reference
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_ex1502l3_vertical_adjudication.py > evidence/marine/ex1502l3_vertical_adjudication_v0_1.stdout.json
      - name: Compare datum-independent morphology ordering
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_ex1502l3_w00247_morphology_rank.py > evidence/marine/ex1502l3_w00247_morphology_rank_v0_1.stdout.json
      - name: Freeze second-sensor ledger
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/marine
          find evidence/marine/w00247_multibeam_footprints_v0_1 evidence/marine/w00247_multibeam_product_inventory_v0_1 evidence/marine/ex1502l3_w00247_overlap_v0_1 evidence/marine/ex1502l3_vertical_adjudication_v0_1 evidence/marine/ex1502l3_w00247_morphology_rank_v0_1 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > evidence/marine/guayama_second_sensor_v0_5.sha256
          for f in evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json evidence/marine/w00247_multibeam_product_inventory_v0_1.stdout.json evidence/marine/ex1502l3_w00247_overlap_v0_1.stdout.json evidence/marine/ex1502l3_vertical_adjudication_v0_1.stdout.json evidence/marine/ex1502l3_w00247_morphology_rank_v0_1.stdout.json; do
            if [ -f "$f" ]; then sha256sum "$f" >> evidence/marine/guayama_second_sensor_v0_5.sha256; fi
          done
      - name: Upload bounded second-sensor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guayama-second-sensor-v0-5
          path: |
            evidence/marine/w00247_multibeam_footprints_v0_1/
            evidence/marine/w00247_multibeam_product_inventory_v0_1/
            evidence/marine/ex1502l3_w00247_overlap_v0_1/
            evidence/marine/ex1502l3_vertical_adjudication_v0_1/
            evidence/marine/ex1502l3_w00247_morphology_rank_v0_1/
            evidence/marine/w00247_multibeam_footprints_v0_1.stdout.json
            evidence/marine/w00247_multibeam_product_inventory_v0_1.stdout.json
            evidence/marine/ex1502l3_w00247_overlap_v0_1.stdout.json
            evidence/marine/ex1502l3_vertical_adjudication_v0_1.stdout.json
            evidence/marine/ex1502l3_w00247_morphology_rank_v0_1.stdout.json
            evidence/marine/guayama_second_sensor_v0_5.sha256
          if-no-files-found: warn
          retention-days: 30
