name: JP flood 78-byte closure

on:
  pull_request:
    paths:
      - ".github/workflows/jp-flood-byte-closure.yml"
      - "scripts/acquire_jp_flood_documents.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  byte-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Resolve frozen Quebradillas fallback
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          EXPECTED_SIZE = 51_199_142
          EXPECTED_SHA = "a1a2ccbfe0097da6f531e78f834d01be5a1555700b809d8f68b162db83d23e7a"
          OUT = pathlib.Path("/tmp/Quebradillas.pdf")
          URLS = [
              "https://docs.pr.gov/files/JP-Junta%20de%20Planificacion/Planes%20de%20Mitigaci%C3%B3n%20Aprobados/Actualizados%20por%20los%20municipios/Queb-Approved-HMP.pdf",
              "https://jp.pr.gov/wp-content/uploads/2022/01/Queb-Approved-HMP.pdf",
          ]

          def sha256(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for block in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          errors = []
          for url in URLS:
              candidate = pathlib.Path("/tmp/Quebradillas.candidate.pdf")
              candidate.unlink(missing_ok=True)
              try:
                  req = urllib.request.Request(
                      urllib.parse.quote(url, safe=":/?&=%"),
                      headers={"User-Agent": "spiderweb-pr-jp-flood-byte-closure/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=180) as response, candidate.open("wb") as out:
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          out.write(block)
                  size = candidate.stat().st_size
                  digest = sha256(candidate)
                  if size != EXPECTED_SIZE or digest != EXPECTED_SHA:
                      errors.append(f"{url} HASH_OR_SIZE_MISMATCH size={size} sha256={digest}")
                      candidate.unlink(missing_ok=True)
                      continue
                  candidate.replace(OUT)
                  print(f"QUEBRADILLAS_FROZEN_FALLBACK = PASS url={url} size={size} sha256={digest}")
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(f"{url} {type(exc).__name__}: {exc}")
                  candidate.unlink(missing_ok=True)

          print("QUEBRADILLAS_FROZEN_FALLBACK = FAIL")
          for error in errors:
              print(error)
          raise SystemExit(1)
          PY

      - name: Acquire and hash 78 operational documents
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import pathlib
          import shutil
          import urllib.parse
          from datetime import datetime, timezone

          REPO = pathlib.Path.cwd()
          MODULE_PATH = REPO / "scripts" / "acquire_jp_flood_documents.py"
          spec = importlib.util.spec_from_file_location("jp_flood", MODULE_PATH)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          producer_sha = "d6326c04e8ecc585b4068f8252a903246498dbb3"
          q_path = pathlib.Path("/tmp/Quebradillas.pdf")
          root = pathlib.Path("/tmp/jp-flood-byte-closure")
          raw = root / "raw"
          raw.mkdir(parents=True, exist_ok=True)

          portal_bytes, portal_headers, portal_final = mod.fetch_bytes(mod.PORTAL_URL, 180)
          discovered = mod.discover_series(portal_bytes.decode("utf-8", "ignore"), portal_final)
          if len(discovered) != mod.EXPECTED_LISTED:
              raise SystemExit(f"LISTED_DENOMINATOR_FAIL expected={mod.EXPECTED_LISTED} got={len(discovered)}")
          rows = mod.apply_source_states(discovered)
          mod.validate(rows)

          failures = []
          for index, row in enumerate(sorted(rows, key=lambda r: mod._key(r["municipality"])), 1):
              municipality = row["municipality"]
              print(f"[{index}/78] {municipality} {row['source_state']}")

              if municipality == "Quebradillas":
                  try:
                      verified = mod.verify_frozen_quebradillas(q_path)
                      target = raw / mod.QUEBRADILLAS_FROZEN_FILENAME
                      shutil.copy2(q_path, target)
                      verified = mod.verify_frozen_quebradillas(target)
                      verified["source_transport_url"] = None
                      row["operational_document"] = verified
                  except Exception as exc:
                      failures.append({
                          "municipality": municipality,
                          "source_state": row["source_state"],
                          "url": row.get("fallback_source_url"),
                          "error": f"{type(exc).__name__}: {exc}",
                      })
                  continue

              if municipality == "Florida":
                  candidates = [
                      row["fallback_source_url"],
                      "https://docs.pr.gov/files/JP-Junta%20de%20Planificacion/Planes%20de%20Mitigaci%C3%B3n%20Aprobados/Actualizados%20por%20los%20municipios/Flor-Plan-Approved-HMP.pdf",
                  ]
              else:
                  candidates = [row["source_url"]]

              acquired = None
              candidate_errors = []
              for url in candidates:
                  if not url:
                      continue
                  filename = urllib.parse.unquote(
                      urllib.parse.urlparse(url).path.rsplit("/", 1)[-1]
                  ) or f"{municipality}.pdf"
                  target = raw / filename
                  try:
                      acquired = mod.acquire_resume_safe(url, target, 240)
                      acquired["source_transport_url"] = url
                      break
                  except Exception as exc:
                      candidate_errors.append(f"{url} => {type(exc).__name__}: {exc}")

              if acquired is None:
                  failures.append({
                      "municipality": municipality,
                      "source_state": row["source_state"],
                      "url": candidates,
                      "error": " | ".join(candidate_errors),
                  })
              else:
                  row["operational_document"] = acquired

          now = datetime.now(timezone.utc).isoformat()
          docs = sorted(rows, key=lambda r: mod._key(r["municipality"]))
          operational = [r for r in docs if isinstance(r.get("operational_document"), dict)]

          manifest = {
              "manifest_version": "2.1-byte-closure",
              "producer": "spiderweb-pr",
              "producer_main_sha": producer_sha,
              "generated_at": now,
              "authority": "Junta de Planificación de Puerto Rico",
              "portal_url": mod.PORTAL_URL,
              "portal_final_url": portal_final,
              "portal_sha256": hashlib.sha256(portal_bytes).hexdigest(),
              "portal_etag": portal_headers.get("ETag") or portal_headers.get("Etag"),
              "portal_last_modified": portal_headers.get("Last-Modified"),
              "documents": docs,
              "failures": failures,
          }

          ledger_docs = []
          for row in docs:
              op = row.get("operational_document") or {}
              use_fallback = row["source_state"] != "AVAILABLE"
              ledger_docs.append({
                  "municipality": row["municipality"],
                  "source_state": row["source_state"],
                  "series_document_class": row.get("document_class"),
                  "operational_document_class": (
                      row.get("fallback_document_class") if use_fallback else row.get("document_class")
                  ),
                  "fallback_relationship": row.get("fallback_relationship"),
                  "filename": op.get("filename"),
                  "byte_size": op.get("byte_size"),
                  "sha256": op.get("sha256"),
                  "acquisition_status": op.get("acquisition_status"),
                  "source_transport_url": op.get("source_transport_url"),
                  "series_source_url": row.get("source_url"),
                  "fallback_source_url": row.get("fallback_source_url"),
              })

          total_bytes = sum(int(d["byte_size"]) for d in ledger_docs if isinstance(d.get("byte_size"), int))
          byte_verified = sum(
              1 for d in ledger_docs
              if isinstance(d.get("byte_size"), int)
              and d["byte_size"] > 0
              and isinstance(d.get("sha256"), str)
              and len(d["sha256"]) == 64
          )
          counts = {
              "municipality_denominator": len(docs),
              "series_listed": sum(r["source_state"] != "NOT_LISTED" for r in docs),
              "available": sum(r["source_state"] == "AVAILABLE" for r in docs),
              "listed_but_missing": sum(r["source_state"] == "LISTED_BUT_MISSING" for r in docs),
              "not_listed": sum(r["source_state"] == "NOT_LISTED" for r in docs),
              "operational_document_count": len(operational),
              "byte_verified_count": byte_verified,
              "failure_count": len(failures),
              "total_bytes": total_bytes,
          }
          ledger = {
              "schema_version": "spiderweb.jp-flood-byte-ledger/v1",
              "generated_at": now,
              "producer_main_sha": producer_sha,
              "counts": counts,
              "documents": ledger_docs,
              "failures": failures,
          }

          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "byte-ledger.json").write_text(
              json.dumps(ledger, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with (root / "SHA256SUMS.txt").open("w", encoding="utf-8") as fh:
              for d in sorted(ledger_docs, key=lambda x: x["municipality"]):
                  if d.get("sha256") and d.get("filename"):
                      fh.write(f"{d['sha256']}  {d['filename']}\n")
          with (root / "FAILED_URLS.txt").open("w", encoding="utf-8") as fh:
              for failure in failures:
                  fh.write(json.dumps(failure, ensure_ascii=False) + "\n")

          print(json.dumps(counts, indent=2))

          expected = {
              "municipality_denominator": 78,
              "series_listed": 77,
              "available": 76,
              "listed_but_missing": 1,
              "not_listed": 1,
              "operational_document_count": 78,
              "byte_verified_count": 78,
              "failure_count": 0,
          }
          for key, value in expected.items():
              if counts[key] != value:
                  raise SystemExit(f"JP_FLOOD_BYTE_LEDGER = FAIL {key}: expected={value} got={counts[key]}")
          print("JP_FLOOD_BYTE_LEDGER = PASS 78/78")
          PY

      - name: Upload byte-ledger receipts
        id: upload_receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jp-flood-78-byte-closure
          path: |
            /tmp/jp-flood-byte-closure/manifest.json
            /tmp/jp-flood-byte-closure/byte-ledger.json
            /tmp/jp-flood-byte-closure/SHA256SUMS.txt
            /tmp/jp-flood-byte-closure/FAILED_URLS.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Persist certified receipts and remove audit workflow
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload_receipts.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_receipts.outputs.artifact-digest }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          root = pathlib.Path("/tmp/jp-flood-byte-closure")
          ledger_path = root / "byte-ledger.json"
          manifest_path = root / "manifest.json"
          sums_path = root / "SHA256SUMS.txt"
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          counts = ledger["counts"]

          expected = {
              "municipality_denominator": 78,
              "series_listed": 77,
              "available": 76,
              "listed_but_missing": 1,
              "not_listed": 1,
              "operational_document_count": 78,
              "byte_verified_count": 78,
              "failure_count": 0,
          }
          for key, value in expected.items():
              if counts.get(key) != value:
                  raise SystemExit(
                      f"PERSIST_CERTIFICATION_FAIL {key}: expected={value} got={counts.get(key)}"
                  )

          out = pathlib.Path(
              "data/jp_flood_documents/certification/2026-09-21"
          )
          out.mkdir(parents=True, exist_ok=True)

          fields = [
              "municipality",
              "source_state",
              "series_document_class",
              "operational_document_class",
              "fallback_relationship",
              "filename",
              "byte_size",
              "sha256",
              "acquisition_status",
          ]
          with (out / "byte-ledger.csv").open(
              "w", encoding="utf-8", newline=""
          ) as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              for row in ledger["documents"]:
                  writer.writerow({key: row.get(key) for key in fields})

          shutil.copy2(sums_path, out / "SHA256SUMS.txt")

          def sha256(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for block in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          artifact_digest = os.environ.get("ARTIFACT_DIGEST", "")
          if artifact_digest.startswith("sha256:"):
              artifact_digest = artifact_digest.split(":", 1)[1]

          certification = {
              "schema_version": "spiderweb.jp-flood-byte-certification/v1",
              "certification_state": "PASS",
              "generated_at": ledger["generated_at"],
              "producer_main_sha": "d6326c04e8ecc585b4068f8252a903246498dbb3",
              "aguayluz_consumer_main_sha": "324b7057cc8466db061443e1e008bf3f39bb83b3",
              "audit_pr": 384,
              "audit_run_id": int(os.environ["AUDIT_RUN_ID"]),
              "audit_artifact_id": int(os.environ["ARTIFACT_ID"]),
              "audit_artifact_sha256": artifact_digest,
              "full_byte_ledger_sha256": sha256(ledger_path),
              "full_manifest_sha256": sha256(manifest_path),
              "sha256sums_sha256": sha256(sums_path),
              "counts": counts,
              "gates": expected,
              "notes": [
                  "Quebradillas remains LISTED_BUT_MISSING in the canonical source series and uses the exact frozen HMP byte manifestation as authoritative_fallback_not_equivalent.",
                  "Florida remains NOT_LISTED in the canonical source series and uses an authoritative HMP fallback.",
                  "Raw PDFs were acquired and hashed during the audit run but are not committed to Git; the permanent ledger freezes filename, byte size, SHA256, source state, and document class for all 78 municipalities.",
              ],
          }
          (out / "certification.json").write_text(
              json.dumps(certification, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(certification, indent=2))
          PY

          git config user.name "jp-flood-byte-certifier"
          git config user.email "noreply@github.com"
          git add -f data/jp_flood_documents/certification/2026-09-21/
          git rm .github/workflows/jp-flood-byte-closure.yml
          git commit -m "Freeze JP flood 78-document byte certification"
          git push origin "HEAD:${HEAD_BRANCH}"
