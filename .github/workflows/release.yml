name: Release

# Tag-triggered release plumbing (T6-53). Pushing a semver tag (e.g. v1.2.0)
# cuts a GitHub Release whose body is the matching CHANGELOG.md section. This is
# additive and tag-only — it never runs on normal branch/PR CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract CHANGELOG section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Extracting CHANGELOG section for $TAG"
          # Pull the lines between this version's heading and the next ## heading.
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "No CHANGELOG entry for $TAG; using a default body."
            echo "Release $GITHUB_REF_NAME" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release_body.md
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
