name: PR grid V2 AguaYLuz NWPS authority migration

on:
  push:
    branches: ["feat/pr-grid-v2-aguayluz-nwps-migration-v1"]
  pull_request:
    paths:
      - "spiderweb/geographic_grid_v2.py"
      - "spiderweb/grid_v2_bindings.py"
      - "spiderweb/grid_v2_source_coordinates.py"
      - "scripts/materialize_pr_grid_v2_source_coordinate_bindings.py"
      - "registry/spatial/v2/migrations/aguayluz_nwps_v1/**"
      - ".github/workflows/pr-grid-v2-aguayluz-nwps-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind-nwps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check out frozen AguaYLuz producer packet
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/jotaele44/aguayluz-pr.git _producer/aguayluz-pr
          git -C _producer/aguayluz-pr checkout --detach c5082ac80e6d25235e724732216cbf14d31eaacf
          test "$(git -C _producer/aguayluz-pr rev-parse HEAD)" = "c5082ac80e6d25235e724732216cbf14d31eaacf"
          git -C _producer/aguayluz-pr fetch --depth 1 origin c12cccce16e3704b2ddbcb0a9a0a6e30f90ce77a

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install authority migration dependencies
        run: python -m pip install --disable-pip-version-check pytest pyproj==3.8.0

      - name: Stage frozen producer packet and historical source bytes
        run: |
          mkdir -p artifacts/producer artifacts/authority
          cp _producer/aguayluz-pr/federation/spatial/migrations/nwps_v1/binding_input.jsonl artifacts/producer/binding_input.jsonl
          cp _producer/aguayluz-pr/federation/spatial/migrations/nwps_v1/profile_records.jsonl artifacts/producer/profile_records.jsonl
          cp _producer/aguayluz-pr/federation/spatial/migrations/nwps_v1/producer_receipt.json artifacts/producer/producer_receipt.json
          git -C _producer/aguayluz-pr show c12cccce16e3704b2ddbcb0a9a0a6e30f90ce77a:data/nwps_gauge_state.jsonl > artifacts/producer/source_snapshot_at_export.jsonl

      - name: Verify frozen producer packet
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/producer")
          receipt = json.loads((root / "producer_receipt.json").read_text())
          binding = root / "binding_input.jsonl"
          records = root / "profile_records.jsonl"
          source = root / "source_snapshot_at_export.jsonl"

          assert hashlib.sha256(source.read_bytes()).hexdigest() == "ef1c19c06a428faa188b1f2d92d8fe6156798904eb982456e2f0269d7216e639"
          assert receipt["Source_SHA256"] == "ef1c19c06a428faa188b1f2d92d8fe6156798904eb982456e2f0269d7216e639"
          assert receipt["Binding_Input_SHA256"] == "cc20eac89b8588dd234574543741eb8af90ffd6edaf23a44692cf2fbe2bd5df7"
          assert receipt["Profile_Records_SHA256"] == "4f470d1747e0073aff64e5e622744d79b45508c2438868d710ceba4df537535e"
          assert hashlib.sha256(binding.read_bytes()).hexdigest() == receipt["Binding_Input_SHA256"]
          assert hashlib.sha256(records.read_bytes()).hexdigest() == receipt["Profile_Records_SHA256"]
          assert receipt["Input_Record_Count"] == 118
          assert receipt["Binding_Input_Record_Count"] == 118
          assert receipt["Profile_Record_Count"] == 118
          assert receipt["Unique_Record_ID_Count"] == 118
          assert receipt["Source_CRS"] == "EPSG:4326"
          assert receipt["Coordinate_Evidence_State"] == "VERIFIED_SOURCE_COORDINATE"
          print("FROZEN_PRODUCER_PACKET=PASS")
          PY

      - name: Run Spiderweb source-coordinate migration regressions
        run: python -m pytest -q tests/test_geographic_grid_v2.py tests/test_grid_v2_bindings.py tests/test_grid_v2_source_coordinates.py

      - name: Bind producer records at authoritative L1
        run: |
          python scripts/materialize_pr_grid_v2_source_coordinate_bindings.py             --input artifacts/producer/binding_input.jsonl             --level L1             --bindings-out artifacts/authority/L1.bindings.jsonl             --projection-out artifacts/authority/L1.projection_audit.jsonl             --receipt-out artifacts/authority/L1.binding_receipt.json

      - name: Certify first production migration lane
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/authority")
          receipt = json.loads((root / "L1.binding_receipt.json").read_text())
          bindings_path = root / "L1.bindings.jsonl"
          projection_path = root / "L1.projection_audit.jsonl"
          bindings = [json.loads(x) for x in bindings_path.read_text().splitlines() if x.strip()]
          projections = [json.loads(x) for x in projection_path.read_text().splitlines() if x.strip()]

          assert receipt["Receipt_State"] == "PASS"
          assert receipt["Migration_Provenance_Class"] == "RECOMPUTED_FROM_SOURCE_COORDINATE"
          assert receipt["Coordinate_Evidence_State"] == "VERIFIED_SOURCE_COORDINATE"
          assert receipt["Grid_ID"] == "PR_GRID_GEOGRAPHIC_V2"
          assert receipt["Grid_Version"] == "2.0.0-rc1"
          assert receipt["Grid_Manifest_SHA256"] == "8902af188ad449955119016f5747fe2393c582d9ed552fb03bcaecd9ab510aa4"
          assert receipt["Target_CRS"] == "EPSG:6566"
          assert receipt["Input_SHA256"] == "cc20eac89b8588dd234574543741eb8af90ffd6edaf23a44692cf2fbe2bd5df7"
          assert receipt["Input_Record_Count"] == 118
          assert receipt["Projection_Audit_Row_Count"] == 118
          assert receipt["Binding_Row_Count"] == 118
          assert receipt["State_Counts"] == {"INTERIOR": 118}
          assert receipt["Source_CRS_Counts"] == {"EPSG:4326": 118}
          assert len(bindings) == 118
          assert len(projections) == 118
          assert len({(row["Repository"], row["Record_ID"]) for row in bindings}) == 118
          assert all(row["Repository"] == "aguayluz-pr" for row in bindings)
          assert all(row["Grid_Level"] == "L1" for row in bindings)
          assert all(row["Binding_State"] == "INTERIOR" for row in bindings)
          assert all(row["Uncertainty_Class"] == "EXACT" for row in bindings)
          assert all(row["Geometry_State"] == "VERIFIED_PROJECTED_POINT" for row in bindings)
          assert all(row["Migration_Provenance_Class"] == "RECOMPUTED_FROM_SOURCE_COORDINATE" for row in projections)
          assert all(row["Target_CRS"] == "EPSG:6566" for row in projections)
          assert receipt["Binding_Output_SHA256"] == hashlib.sha256(bindings_path.read_bytes()).hexdigest()
          assert receipt["Projection_Output_SHA256"] == hashlib.sha256(projection_path.read_bytes()).hexdigest()
          assert receipt["Binding_Output_SHA256"] == "7c49ff0463eb3b950f86854b54a3ff8e607b30114594db75a3fda7732bdc2bf1"
          assert receipt["Projection_Output_SHA256"] == "ca997c75f009a12fdefb73d2dec3c88a6f447c8ca29dd39cafe919d80f6b35f9"

          frozen = json.loads(Path(
              "registry/spatial/v2/migrations/aguayluz_nwps_v1/binding_receipt.json"
          ).read_text())
          assert receipt == frozen

          versions = {(row["PyProj_Version"], row["PROJ_Version"]) for row in projections}
          assert versions == {("3.8.0", "9.8.1")}
          print("AGUAYLUZ_NWPS_V2_AUTHORITY_BINDING=PASS")
          PY

      - name: Upload authority migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spiderweb-aguayluz-nwps-pr-grid-v2-l1
          path: artifacts/
          retention-days: 90

      - name: Persist Spiderweb-owned authority outputs
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          target=registry/spatial/v2/migrations/aguayluz_nwps_v1/generated
          mkdir -p "$target"
          cp artifacts/authority/L1.bindings.jsonl "$target/L1.bindings.jsonl"
          cp artifacts/authority/L1.projection_audit.jsonl "$target/L1.projection_audit.jsonl"
          cp artifacts/authority/L1.binding_receipt.json "$target/L1.binding_receipt.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$target/L1.bindings.jsonl" "$target/L1.projection_audit.jsonl" "$target/L1.binding_receipt.json"
          if git diff --cached --quiet; then
            echo "AUTHORITY_OUTPUTS_ALREADY_FROZEN=PASS"
            exit 0
          fi
          git commit -m "cert(spatial): freeze AguaYLuz NWPS V2 authority outputs"
          git push origin HEAD:feat/pr-grid-v2-aguayluz-nwps-migration-v1
