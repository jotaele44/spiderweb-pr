name: PR Archipelago CUSP Index

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cusp-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mapbox-vector-tile
      - name: Freeze bounded PR CUSP index and exact named downloads
        run: |
          python scripts/acquire_pr_archipelago_cusp_index.py \
            --output evidence/pr_archipelago/geometry_snapshots/noaa_cusp_index
      - name: Inventory CUSP evidence
        if: always()
        run: |
          find evidence/pr_archipelago/geometry_snapshots/noaa_cusp_index -type f -printf '%p %s bytes\n' | sort || true
          sha256sum evidence/pr_archipelago/geometry_snapshots/noaa_cusp_index/cusp_pr_manifest.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-archipelago-cusp
          path: evidence/pr_archipelago/geometry_snapshots/noaa_cusp_index/
          if-no-files-found: error
          retention-days: 30
