name: Spiderweb recovery successor v2 — acquisition and archive-WFS equivalence

on:
  push:
    branches:
      - recovery/floot-baseline-2026-09-30
    paths:
      - ".recovery/spiderweb-successor-v2/**"
      - ".github/workflows/recovery-spiderweb-successor-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install recovered-tree npx compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo "REAL_NPX=$(command -v npx)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/recovery-bin"
          cp .recovery/spiderweb-exact/npx-v5-wrapper.sh "$RUNNER_TEMP/recovery-bin/npx"
          chmod +x "$RUNNER_TEMP/recovery-bin/npx"
          echo "$RUNNER_TEMP/recovery-bin" >> "$GITHUB_PATH"

      - name: Reproduce exact 75-test baseline
        shell: bash
        run: bash .recovery/spiderweb-exact/run_v3.sh

      - name: Apply successor v1 and v2 overlays
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          V1=".recovery/spiderweb-successor-v1/overlay.tar.gz"
          V2=".recovery/spiderweb-successor-v2/overlay.tar.gz"
          echo "ad60cb8662067a28a21c33709024314ebd03970285b5ed24fd22082114204630  $V1" | sha256sum -c -
          echo "a933bdc3ed5ab9ffbede02f62e93816a4821a81c6eb677af37edb1619571caaa  $V2" | sha256sum -c -
          tar -xzf "$V1" -C "$ROOT"
          tar -xzf "$V2" -C "$ROOT"
          cd "$ROOT"
          echo "b70b62a6228021cef632a15a6388a26de323a970fffb03a5c0eeca52363aedd0  helpers/spatialUploadPipeline.tsx" | sha256sum -c -
          echo "6e257a8588de54de810ee0f54422931a70e3a4d1217437769fe35beec889421a  helpers/spatialUploadPipeline.spec.tsx" | sha256sum -c -
          echo "7ec87eaa780fab253f4867e8c2212c4f28cb78d59868e14d88b2959c5d459ec8  helpers/spatialAcquisition.tsx" | sha256sum -c -
          echo "ca8eae6693e8e25379d853103873455432c4e75399a269198faa610bc5681c6c  helpers/spatialAcquisition.spec.tsx" | sha256sum -c -
          echo "deead02d09c3acee81b67681f032902f94e43e4267078f00d8d723d3c8cfa4df  helpers/spatialEquivalence.tsx" | sha256sum -c -
          echo "0247fe93f3dbacf8a8b7eb070c2aa42ba091f070d4ba942e0e54cb063816e065  helpers/spatialEquivalence.spec.tsx" | sha256sum -c -
          sha256sum helpers/spatialUploadPipeline.tsx helpers/spatialUploadPipeline.spec.tsx helpers/spatialAcquisition.tsx helpers/spatialAcquisition.spec.tsx helpers/spatialEquivalence.tsx helpers/spatialEquivalence.spec.tsx > successor-v2-overlay-hashes.txt

      - name: Execute successor v2 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose 2>&1 | tee successor-v2-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v2-test-exit.txt
          test "$status" = "0"
          grep -q "spatialUploadPipeline.spec.tsx" successor-v2-vitest.log
          grep -q "spatialAcquisition.spec.tsx" successor-v2-vitest.log
          grep -q "spatialEquivalence.spec.tsx" successor-v2-vitest.log
          grep -q "20 passed" successor-v2-vitest.log
          grep -q "108 passed" successor-v2-vitest.log

      - name: Freeze successor v2 receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=spiderweb-recovery-successor/v2"
            echo "baseline_head=c7b832559f1170bebf2a816db97b967be8c38d90"
            echo "successor_v1_overlay=ad60cb8662067a28a21c33709024314ebd03970285b5ed24fd22082114204630"
            echo "successor_v2_overlay=a933bdc3ed5ab9ffbede02f62e93816a4821a81c6eb677af37edb1619571caaa"
            echo "baseline_tests=75"
            echo "successor_v1_tests=90"
            echo "successor_v2_tests=108"
            echo "fetch_default=DISABLED_FAIL_CLOSED"
            echo "equivalence_identity=EXACT_STABLE_ID"
            echo "state=PASS"
          } > successor-v2-receipt.txt
          sha256sum package-lock.json successor-v2-overlay-hashes.txt successor-v2-vitest.log successor-v2-receipt.txt > successor-v2-evidence-hashes.txt

      - name: Upload successor v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiderweb-recovery-successor-v2
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/recovery-package-hashes.txt
            ${{ runner.temp }}/recovered/successor-v2-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v2-vitest.log
            ${{ runner.temp }}/recovered/successor-v2-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v2-receipt.txt
            ${{ runner.temp }}/recovered/successor-v2-evidence-hashes.txt
