# Missing-persons source registry (phase 2a).
#
# Single source of truth for: harvester wiring, license/federation gates,
# refresh cadence, expected PR yield, stratum tier. The audit
# (tools/pr_geodata_integrity_audit.py:audit_missing_persons_sources) reads
# this file and reports coverage gaps. The consolidator
# (scripts/consolidate_missing_persons.py, phase 2b) reads it to discover
# which per-source canonicals exist on disk.
#
# Statuses:
#   harvester_landed  — code exists and has been verified end-to-end
#   harvester_planned — slated in the rollout but not yet built
#   manual_pull       — operator drops files; no automation possible
#   aggregate_only    — only aggregate counts available, never case-level
#   cannot_reach      — closed to outside ingestion (LE-only / paywalled)
#
# Strata:
#   A — confirmed/structured (federation aggregate-eligible)
#   B — confirmed/narrative  (federation aggregate-eligible, with provenance)
#   C — tip-stream           (workbench-only, NEVER federation)
#
# federation_eligible options:
#   true             — case + aggregate both go through federation envelope
#   aggregate_only   — only the municipio aggregate; never per-case
#   false            — never federated (raw PII, ToS-restricted, or stratum C)
#
# Adding a source: copy a stanza, set status=harvester_planned, set the
# expected_pr_yield_per_year so the audit can flag yield-gap regressions later.

version: missing_persons_sources_v1
generated_by: phase_2a
last_updated: "2026-06-12"

