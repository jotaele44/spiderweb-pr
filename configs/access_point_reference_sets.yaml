# Published reference datasets used by the access-point registries.
#
# A reference set is somebody else's map. It is held by the hash of its exact
# bytes and read only with a coordinate reference system BOUND here, together
# with where that binding was read. A set that is not held is recorded by hash
# for lineage and is never parsed.
#
# None of these is field truth. A comparison with them is agreement with another
# interpretation, which has its own positional error (stated below, in the
# publisher's words), not field-verified accuracy.
#
# These files were supplied by the repository owner on 2026-11-17.
version: access_point_reference_sets_v1
sets:
  - set_id: usgs_karst_sinkholes_over_30m
    role: LABELS
    format: geojson
    held: true
    path: evidence/access_points/reference/usgs_karst_map/sinkholes_30m.geojson
    sha256: d2b4bdc8131af836aba05e7ee34fdf9128badb954e7a4b486a206b7992973ca4
    provider: USGS_KARST_MAP_OF_PUERTO_RICO
    title: >-
      Karst Map of Puerto Rico (U.S. Geological Survey Open-File Report, 2010):
      feature class sinkholes_30m
    published: "2010"
    received_utc: "2026-11-17T23:23:00Z"
    publisher_statement: >-
      Polygons showing locations of sinkholes deeper than 30 meters in Puerto
      Rico.
    label_class: SINKHOLE
    stated_min_depth_m: 30
    bound_crs: "EPSG:32161"
    crs_basis: >-
      The export declares no coordinate reference system and holds projected
      metres. The parent database holds the definition
      NAD_1983_StatePlane_Puerto_Rico_Virgin_Islands_FIPS_5200 and records a
      projection step dated 2012; its descriptive metadata still names a
      polyconic projection, which the coordinates cannot be (they are positive
      and offset by 200,000 m). Coherence check: bound to EPSG:32161, 1,171 of
      1,173 outlines fall inside the independently published northern karst
      limit.
    positional_offset_m: 100
    positional_basis: >-
      Publisher's metadata: "Offsets of as much as 100 meters between the karst
      data and base map topographic features may occur." The outlines were
      digitised from scanned paper maps at 1:20,000 and 1:140,000; the source
      map has a 50 m contour interval.
    parent_sha256: 5cd5c9e455ec9d081c20edd02302b94b1ffa6d01c91ab7bd2d323008c6ddc7cd
    note: US_GOVERNMENT_PUBLIC_DOMAIN

