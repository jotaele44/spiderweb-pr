# NOAA NGS Emergency Response Imagery (ERI) flights covering Puerto Rico and the
# U.S. Virgin Islands, served to the map by server/backend/eri_imagery.py.
#
# Source: the public AWS Open Data bucket `noaa-eri-pds` (CC0-1.0). The bucket
# holds per-flight folders of GeoTIFFs (EPSG:4326, RGBA) and no pre-rendered
# tile pyramid, so the backend renders Web-Mercator tiles from them on request.
#
# Every entry below was read from the bucket's own STAC index
# (`noaa_eri_stac.parquet`, bbox filter over PR/USVI) on 2026-11-14: flight
# folder, image count, extent and cell size are observed, not assumed.
# `acquired` is the STAC `datetime` date, except CB2201a where STAC carries only
# a 2022-01-01 placeholder, so the year alone is recorded.
#
# cell_arcsec is the nominal image cell. File names encode the north-west
# corner (`C0643345w174500n` = 064°33'45"W 17°45'00"N); the backend derives each
# image footprint from that corner plus this cell size.
#
# min_zoom bounds how many images one tile can touch (a tile below it would
# need dozens of remote reads). The map shows footprints below min_zoom.
# Measured 2026-11-14 from a cold cache: a zoom-14 tile composites 4-9 images
# in roughly 3-5 s for the pre-event flights; the 2017 flights are plain
# (non-cloud-optimized) JPEG GeoTIFFs and took up to 18 s, zoom 15+ about 1-6 s.
#
# This registry is deliberately separate from configs/layer_catalog.yaml: that
# catalog is the label tree for pin (vector) layers and is held in a one-to-one
# mapping with configs/master_pin_registry.yaml, which has no place for raster
# imagery.
version: eri_imagery_sources_v0_1
bucket_url: https://noaa-eri-pds.s3.amazonaws.com
attribution: "NOAA National Geodetic Survey — Emergency Response Imagery (CC0-1.0)"

datasets:
  - id: pre_event_2024_cb2401a
    label: "2024 Pre-Event — Puerto Rico & USVI"
    event: 2024_Pre_Event
    flight: CB2401a_OB_N_RGB
    kind: pre_event
    acquired: "2024-03-19"
    cell_arcsec: 45
    bbox: [-67.2876, 17.6624, -64.6999, 18.5501]
    min_zoom: 14
    max_zoom: 20
