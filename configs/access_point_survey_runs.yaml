# Real gridded surveys processed for the access-point registries.
#
# A run cuts a window out of one or more held, hashed elevation products,
# around the point a registry already holds for one record, and looks for
# closed basins in it.  Nothing here gives a record a position: the window
# centre is read from the registry, never typed in this file.
#
# What must be stated for every product, and where it was read:
#   * the vertical datum THE PRODUCT states, and where that statement is
#     (a structured metadata element is stronger than a sentence);
#   * the vertical uncertainty, or null if no source publishes one.  A null
#     is kept as unknown; it is never replaced by a typical value.
#
# Thresholds are working values.  They have not been calibrated against
# field truth.
version: access_point_survey_runs_v1
runs:
  - run_id: "2026-11-17"
    registry: access_point.inland
    target_feature: INAP-PR-000003
    half_size_m: 500
    wide_half_size_m: 1500
    wide_deep_threshold_m: 10.0
    parameters:
      min_depth_m: 1.0
      min_area_m2: 100.0
      # This run was made before nested basins became the default, and is
      # kept as it was run. Every run must state the mode explicitly.
      nested: false
    products:
      - epoch: "2018"
        filename: USGS_1m_x72y204_PR_PRVI_F_2018.tif
        native_identifier: "TNM:5eb61d7d82ce25b5135ae912"
        survey_date: "2018-04-17/2019-04-19"
        stated_vertical_datum: NAVD88
        vertical_statement_basis: >-
          One sentence in the product abstract ("All bare earth elevation
          values are in meters and are referenced to the North American
          Vertical Datum of 1988"), identical across the programme. The tile's
          own metadata file has no structured vertical-datum element and the
          GeoTIFF carries no vertical reference.
        vertical_uncertainty_m: 0.072
        vertical_uncertainty_basis: >-
          Project-level RMSEz (7.2 cm) published by the US Interagency
          Elevation Inventory for "2018 Hurricane Maria PR and USVI Lidar",
          whose distributor list names this project (PR_PRVI_F_2018). It is a
          project figure for open ground, not a per-cell uncertainty.
        lineage_root_id: "USIEI:GlobalID:{933E88E7-A131-40E5-8BAA-C9575216E040}"
      - epoch: "2024"
        filename: USGS_1M_19_x72y204_PR_PuertoRicoUSVI_D24.tif
        native_identifier: "TNM:6a753f0e1ba49b79d0c347d8"
        survey_date: "2023-12-27/2025-03-20"
        stated_vertical_datum: NAVD88
        vertical_statement_basis: >-
          The same programme sentence in the product abstract. The tile's own
          metadata file has no structured vertical-datum element and the
          GeoTIFF carries no vertical reference.
        vertical_uncertainty_m: null
        vertical_uncertainty_basis: >-
          None published: the tile metadata states no accuracy and the
          elevation inventory did not list this project on 2026-11-16.
        lineage_root_id: null
