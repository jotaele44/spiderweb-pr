# Spiderweb-PR Martin bootstrap configuration.
#
# SECURITY / GOVERNANCE INVARIANT:
# - This committed file deliberately contains ZERO delivery sources.
# - Runtime source-bearing configs MUST be generated by
#   scripts/build_martin_config.py from configs/martin_delivery.yaml and
#   configs/layer_catalog.yaml.
# - Production generation admits publication_state=published only.
# - Do NOT add geojson.paths or named sources here.
listen_addresses: "0.0.0.0:3000"
keep_alive: 75
worker_processes: 2

cache:
  size_mb: 64
  minzoom: 0
  maxzoom: 14

cors:
  origin:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  max_age: 3600

observability:
  metrics: {}

geojson:
  extent: 4096
  buffer: 64
  sources: {}
